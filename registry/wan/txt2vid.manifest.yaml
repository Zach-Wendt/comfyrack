description: 'Wan 2.2 14B dual-stage (high-noise to low-noise) text-to-video with a LoRA stack per stage (lightning-step distill, style LoRAs; add your own identity LoRA in the Power Lora Loader nodes) and a film-grain finishing pass; output is an mp4 video. The LoRA slots'' on/off toggles are not exposed as flags, and some slots are switched off because their LoRAs are not on disk. Pass UNet filenames without the ''wan\'' subfolder prefix or model validation fails; the flag defaults are already corrected.'
workflow: txt2vid.json
mode: [t2v]
output_node_title: "Video Combine \U0001F3A5\U0001F165\U0001F157\U0001F162"
requires:
  nodes:
    CLIPLoader: core
    CLIPTextEncode: core
    EmptyHunyuanLatentVideo: core
    Film Grain: RES4LYF
    KSamplerAdvanced: core
    Power Lora Loader (rgthree): rgthree-comfy
    PrimitiveInt: core
    UNETLoader: core
    VAEDecode: core
    VAELoader: core
    VHS_VideoCombine: ComfyUI-VideoHelperSuite
    WanVideoNAG: ComfyUI-KJNodes
  custom_node_packs:
  - name: RES4LYF
    git: https://github.com/ClownsharkBatwing/RES4LYF
  - name: rgthree-comfy
    git: https://github.com/rgthree/rgthree-comfy
    registry_id: rgthree-comfy
  - name: ComfyUI-VideoHelperSuite
    git: https://github.com/Kosinkadink/ComfyUI-VideoHelperSuite
    registry_id: comfyui-videohelpersuite
  - name: ComfyUI-KJNodes
    git: https://github.com/kijai/ComfyUI-KJNodes
    registry_id: comfyui-kjnodes
  models:
  - directory: vae
    name: wan_2.1_vae.safetensors
    url: https://huggingface.co/Comfy-Org/Wan_2.1_ComfyUI_repackaged/resolve/main/split_files/vae/wan_2.1_vae.safetensors
  - directory: text_encoders
    name: umt5_xxl_fp8_e4m3fn_scaled.safetensors
    url: https://huggingface.co/Comfy-Org/Wan_2.1_ComfyUI_repackaged/resolve/main/split_files/text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors
  - directory: diffusion_models
    name: wan/wan2.2_t2v_low_noise_14B_fp8_scaled.safetensors
    url: https://huggingface.co/Comfy-Org/Wan_2.2_ComfyUI_Repackaged/resolve/main/split_files/diffusion_models/wan2.2_t2v_low_noise_14B_fp8_scaled.safetensors
  - directory: diffusion_models
    name: wan/wan2.2_t2v_high_noise_14B_fp8_scaled.safetensors
    url: https://huggingface.co/Comfy-Org/Wan_2.2_ComfyUI_Repackaged/resolve/main/split_files/diffusion_models/wan2.2_t2v_high_noise_14B_fp8_scaled.safetensors
flags:
  positive_prompt:
    node_title: Positive Prompt
    param: text
    type: str
    required: true
    node: '3'
  negative_prompt:
    node_title: Negative Prompt
    param: text
    type: str
    default: "\u8272\u8C03\u8273\u4E3D\uFF0C\u8FC7\u66DD\uFF0C\u9759\u6001\uFF0C\u7EC6\
      \u8282\u6A21\u7CCA\u4E0D\u6E05\uFF0C\u5B57\u5E55\uFF0C\u98CE\u683C\uFF0C\u4F5C\
      \u54C1\uFF0C\u753B\u4F5C\uFF0C\u753B\u9762\uFF0C\u9759\u6B62\uFF0C\u6574\u4F53\
      \u53D1\u7070\uFF0C\u6700\u5DEE\u8D28\u91CF\uFF0C\u4F4E\u8D28\u91CF\uFF0CJPEG\u538B\
      \u7F29\u6B8B\u7559\uFF0C\u4E11\u964B\u7684\uFF0C\u6B8B\u7F3A\u7684\uFF0C\u591A\
      \u4F59\u7684\u624B\u6307\uFF0C\u753B\u5F97\u4E0D\u597D\u7684\u624B\u90E8\uFF0C\
      \u753B\u5F97\u4E0D\u597D\u7684\u8138\u90E8\uFF0C\u7578\u5F62\u7684\uFF0C\u6BC1\
      \u5BB9\u7684\uFF0C\u5F62\u6001\u7578\u5F62\u7684\u80A2\u4F53\uFF0C\u624B\u6307\
      \u878D\u5408\uFF0C\u9759\u6B62\u4E0D\u52A8\u7684\u753B\u9762\uFF0C\u6742\u4E71\
      \u7684\u80CC\u666F\uFF0C\u4E09\u6761\u817F\uFF0C\u80CC\u666F\u4EBA\u5F88\u591A\
      \uFF0C\u5012\u7740\u8D70, 8k, UHD, hyper-realism, cinematic, glossy finish,"
    node: '4'
  width:
    node_title: Empty HunyuanVideo 1.0 Latent
    param: width
    type: int
    default: 1280
    node: '5'
  height:
    node_title: Empty HunyuanVideo 1.0 Latent
    param: height
    type: int
    default: 720
    node: '5'
  length:
    node_title: Empty HunyuanVideo 1.0 Latent
    param: length
    type: int
    default: 81
    help: Frame count.
    node: '5'
  seed:
    node_title: Int
    param: value
    type: int
    required: true
    help: Feeds KSampler Advanced noise_seed on both stages via a shared PrimitiveInt
      node.
    node: '197'
  low_noise_unet_name:
    node_title: Load Diffusion Model (Low-Noise Stage)
    param: unet_name
    type: str
    default: wan2.2_t2v_low_noise_14B_fp8_scaled.safetensors
    help: On disk 2026-07-20, flat in models/diffusion_models/ (no 'wan\' subfolder,
      unlike the source workflow's own default).
    node: '104'
  high_noise_unet_name:
    node_title: Load Diffusion Model (High-Noise Stage)
    param: unet_name
    type: str
    default: wan2.2_t2v_high_noise_14B_fp8_scaled.safetensors
    help: On disk 2026-07-20, flat in models/diffusion_models/ (no 'wan\' subfolder,
      unlike the source workflow's own default).
    node: '106'
  clip_name:
    node_title: Load CLIP
    param: clip_name
    type: str
    default: umt5_xxl_fp8_e4m3fn_scaled.safetensors
    node: '22'
  vae_name:
    node_title: Load VAE
    param: vae_name
    type: str
    default: wan_2.1_vae.safetensors
    node: '8'
  nag_scale:
    node_title: WanVideoNAG
    param: nag_scale
    type: float
    default: 11
    node: '115'
  steps:
    node_title: KSampler Advanced (High-Noise Stage)
    param: steps
    type: int
    default: 8
    help: Both stages share the same step count in the source graph; this flag only
      patches the high-noise node -- set low-noise steps separately in the JSON if
      they need to diverge.
    node: '168'
  frame_rate:
    node_title: "Video Combine \U0001F3A5\U0001F165\U0001F157\U0001F162"
    param: frame_rate
    type: int
    default: 16
    node: '194'
  filename_prefix:
    node_title: "Video Combine \U0001F3A5\U0001F165\U0001F157\U0001F162"
    param: filename_prefix
    type: str
    default: AnimateDiff
    node: '194'
