mode: [v2v]
description: >-
  MiniMax H3 latent-guide sharpen pass: takes an existing video clip, anchors
  it as pixel-level latent guidance, and runs it through the LMS LoRA
  (minimax_h3_lms_v1.0_r64.safetensors) with its trigger caption to sharpen
  and restore photorealistic detail. Source and target clip lengths must land
  on the model's valid buckets (5, 22, 39, 56, 73, 90, 107, 124, ...) or the
  alignment breaks. A first-block cache speed patch is on by default.
workflow: sharpen.json
output_node_title: Save Video
output: video
requires:
  nodes:
    ApplyMiniMaxH3FirstBlockCache: unknown
    BasicGuider: core
    BasicScheduler: core
    CLIPLoader: core
    CreateVideo: core
    KSamplerSelect: core
    LoraLoaderModelOnly: core
    MiniMaxH3AddGuide: core
    MiniMaxH3ImageToVideo: core
    MiniMaxH3SigmaShift: core
    RandomNoise: core
    ResolutionSelector: core
    SamplerCustomAdvanced: core
    SaveVideo: core
    UNETLoader: core
    VAEDecode: core
    VAEDecodeAudio: core
    VAELoader: core
    VHS_LoadVideoPath: ComfyUI-VideoHelperSuite
  custom_node_packs:
  - name: ComfyUI-VideoHelperSuite
    git: https://github.com/Kosinkadink/ComfyUI-VideoHelperSuite
    registry_id: comfyui-videohelpersuite
  models:
  - directory: vae
    name: minimax_h3_video_vae_fp16.safetensors
    url: https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/vae/minimax_h3_video_vae_fp16.safetensors
  - directory: vae
    name: minimax_h3_audio_vae_fp32.safetensors
    url: https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/vae/minimax_h3_audio_vae_fp32.safetensors
  - directory: text_encoders
    name: qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors
    url: https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors
  - directory: diffusion_models
    name: minimax_h3_fl2va_pruned_int8_convrot.safetensors
    url: https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/diffusion_models/minimax_h3_fl2va_pruned_int8_convrot.safetensors
  - directory: loras
    name: minimax_h3_lms_v1.0_r64.safetensors
    url: https://huggingface.co/RunningHubAI/rh-minimax-h3-lms-v1.0-r64.safetensors-lora/resolve/main/minimax_h3_lms_v1.0_r64.safetensors
flags:
  source_video:
    node_title: Video (Upload)
    param: video
    type: video
    required: true
    help: The clip to sharpen. Anchored at frame_idx=0 -- must be the same
      resolution as megapixels/aspect_ratio below and land on the model's
      valid frame-length bucket (5, 22, 39, 56, 73, 90, 107, 124, ...) at
      24fps.
    node: loadvid
  prompt:
    node_title: MiniMax H3 Image to Video
    param: prompt
    type: str
    default: Enhance this video with sharp, crisp details while preserving a
      natural photorealistic appearance.
    help: This is the LMS LoRA's own documented trigger caption -- don't
      replace it with a generic content description, the LoRA conditions on
      the source clip itself via the guide latent, not on this text.
    node: t2v
  aspect_ratio:
    node_title: Resolution Selector
    param: aspect_ratio
    type: str
    default: 1:1 (Square)
    node: res
  megapixels:
    node_title: Resolution Selector
    param: megapixels
    type: float
    default: 0.3
    node: res
  length_frames:
    node_title: MiniMax H3 Image to Video
    param: length
    type: int
    default: 73
    help: Must land on the model's valid clip-length bucket (5, 22, 39, 56,
      73, 90, 107, 124, ...) and match source_video's real frame count.
    node: t2v
  steps:
    node_title: Basic Scheduler
    param: steps
    type: int
    default: 20
    node: sched
  lora_strength:
    node_title: Load LoRA
    param: strength_model
    type: float
    default: 1
    node: lora
  fbc_mode:
    node_title: MiniMax H3 FirstBlockCache
    param: mode
    type: str
    default: 'H3 Fast — 0.10 / max 2'
    help: See i2v.manifest.yaml's fbc_mode flag for the full preset list and
      validation notes -- same node, same defaults, on by default here too.
    node: fbc
  seed:
    node_title: RandomNoise
    param: noise_seed
    type: int
    required: true
    node: noise
  filename_prefix:
    node_title: Save Video
    param: filename_prefix
    type: str
    default: video/MiniMax_H3_sharpen
    node: save
