mode: [i2v]
description: >-
  MiniMax H3 (fl2va) image-to-video: same single-stage sampling pipeline as
  the text-to-video workflow, with a first-frame image input and a square
  aspect-ratio default. Needs five model files: the fl2va UNet, a Qwen3VL text
  encoder, video and audio VAEs, and the turbo LoRA (LoRA applies only when
  the lightning switch is on).
workflow: i2v.json
output_node_title: Save Video
output: video
requires:
  nodes:
    ApplyMiniMaxH3FirstBlockCache: unknown
    BasicGuider: core
    BasicScheduler: core
    CLIPLoader: core
    ComfyMathExpression: core
    ComfySwitchNode: core
    CreateVideo: core
    GetImageSize: core
    ImageScaleToTotalPixels: core
    KSamplerSelect: core
    LoadImage: core
    LoraLoaderModelOnly: core
    MiniMaxH3ImageToVideo: core
    PrimitiveBoolean: core
    PrimitiveFloat: core
    PrimitiveInt: core
    RandomNoise: core
    ResolutionSelector: core
    SamplerCustomAdvanced: core
    SaveVideo: core
    UNETLoader: core
    VAEDecode: core
    VAEDecodeAudio: core
    VAELoader: core
  models:
  - directory: vae
    name: minimax_h3_video_vae_fp16.safetensors
    url: https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/vae/minimax_h3_video_vae_fp16.safetensors
  - directory: vae
    name: minimax_h3_audio_vae_fp32.safetensors
    url: https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/vae/minimax_h3_audio_vae_fp32.safetensors
  - directory: diffusion_models
    name: minimax_h3_fl2va_pruned_int8_convrot.safetensors
    url: https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/diffusion_models/minimax_h3_fl2va_pruned_int8_convrot.safetensors
  - directory: text_encoders
    name: qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors
    url: https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors
  - directory: loras
    name: minimax_h3_fl2v_turbo_8step_v1.0_comfyui_bf16.safetensors
    url: https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/loras/minimax_h3_fl2v_turbo_8step_v1.0_comfyui_bf16.safetensors
flags:
  fbc_mode:
    node_title: MiniMax H3 FirstBlockCache
    param: mode
    type: str
    default: 'H3 Fast — 0.10 / max 2'
    help: >-
      Speed-cache patch inserted directly after the UNET loader, on by
      default (measured 2026-09-14:
       2.5x speedup at H3 Fast preset, no visible quality loss on a
      contact-sheet compare). Other presets from
      duckyshell/ComfyUI-MiniMaxH3-FirstBlockCache: 'H3 Safe — 0.08 / max 2',
      'H3 Aggressive — 0.12 / max 2', 'H3 Experimental' (needs >8 transformer
      blocks), or 'Custom' (then set threshold/start_percent/end_percent/
      max_consecutive_hits directly in the JSON -- not exposed as flags here
      to keep the flag surface small). Cannot combine with
      EasyCache/LazyCache/CacheDiT/T8 Block Cache if any of those are ever
      added to this graph.
    node: '105:140'
  first_frame_image:
    node_title: Load Image
    param: image
    type: image
    required: true
    help: Source template's baked-in default value was
      transparent_rgb_gaming_mouse.png (not on disk here); pass a real image
      filename already uploaded/present in ComfyUI's input/ dir, or a local
      path for comfyrack to upload.
    node: '114'
  positive_prompt:
    node_title: MiniMax H3 Image to Video
    param: prompt
    type: str
    required: true
    help: Natural-language cinematic/storyboard-style prompt, not booru tags.
    node: '105:104'
  aspect_ratio:
    node_title: Resolution Selector
    param: aspect_ratio
    type: str
    default: 1:1 (Square)
    node: '115'
  megapixels:
    node_title: Resolution Selector
    param: megapixels
    type: float
    default: 0.4
    node: '115'
  duration_seconds:
    node_title: Float (duration)
    param: value
    type: float
    default: 5
    help: Fed through a Math Expression node that snaps frame count to the
      model's 17k+5 grid at 24fps (e.g. 5s -> 124 frames).
    node: '105:111'
  seed:
    node_title: RandomNoise
    param: noise_seed
    type: int
    required: true
    node: '105:15'
  enable_lightning_lora:
    node_title: Boolean (Enable Lightning LoRA)
    param: value
    type: str
    default: 'false'
    help: Boolean switch (comfyrack flags are str/int/float/image only --
      the graph's own baked default is the JSON boolean false; overriding
      via --set would coerce to the Python string 'true'/'false' rather than
      a real boolean, so prefer editing the JSON directly for this one).
    node: '105:126'
  steps_normal:
    node_title: Int
    param: value
    type: int
    default: 20
    help: Two sibling nodes share the title "Int" in this graph (steps_normal
      id 105:124, steps_lightning id 105:125) -- disambiguated by node id.
    node: '105:124'
  steps_lightning:
    node_title: Int
    param: value
    type: int
    default: 8
    node: '105:125'
  lora_name:
    node_title: Load LoRA
    param: lora_name
    type: str
    default: minimax_h3_fl2v_turbo_8step_v1.0_comfyui_bf16.safetensors
    help: >-
      On disk 2026-08-28 in models/loras/. Only applied when
      enable_lightning_lora is true. Alternative validated 2026-09-14:
      minimax_h3_taomate_3step_lora_avg_rank_19_bf16.safetensors (Kijai,
      HF MiniMax-H3_comfy/loras) + steps_lightning=3 -- 1.75x faster than
      the 8-step default in a real A/B, same identity lock, arguably
      better prompt adherence in that test (the 8-step default hallucinated
      an unprompted hand gesture the 3-step run didn't).
    node: '105:121'
  lora_strength:
    node_title: Load LoRA
    param: strength_model
    type: float
    default: 1
    node: '105:121'
  unet_name:
    node_title: Load Diffusion Model
    param: unet_name
    type: str
    default: minimax_h3_fl2va_pruned_int8_convrot.safetensors
    help: On disk 2026-08-28 in models/diffusion_models/.
    node: '105:6'
  clip_name:
    node_title: Load CLIP
    param: clip_name
    type: str
    default: qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors
    help: On disk 2026-08-28 in models/text_encoders/.
    node: '105:13'
  video_vae_name:
    node_title: Load VAE
    param: vae_name
    type: str
    default: minimax_h3_video_vae_fp16.safetensors
    help: On disk 2026-08-28 in models/vae/. This graph has two nodes titled
      "Load VAE" (video vae id 105:11, audio vae id 105:24) --
      disambiguated here by explicit node id.
    node: '105:11'
  audio_vae_name:
    node_title: Load VAE
    param: vae_name
    type: str
    default: minimax_h3_audio_vae_fp32.safetensors
    help: On disk 2026-08-28 in models/vae/.
    node: '105:24'
  fps:
    node_title: Create Video
    param: fps
    type: int
    default: 24
    node: '105:91'
  filename_prefix:
    node_title: Save Video
    param: filename_prefix
    type: str
    default: video/MiniMax_H3
    node: '92'
