description: 'LTX-2.3 i2v/t2v "Movie Maker" single-image talking-head pipeline (a
  Joker-on-the-phone lip-sync demo) driven by "Prompt Relay Encode (Timeline)" (4
  timeline segments, ~5s each, global_prompt + timeline_data JSON). Its distinguishing
  "LATENT GUIDER" technique: the one starting image is used BOTH for standard i2v
  conditioning (LTXVImgToVideoInplace, on the base pass AND again after the spatial-upscale
  second pass) AND separately re-encoded via VAEEncode and injected as an extra identity-anchoring
  latent guide via "LTXV Add Latent Guide" (LTXVAddLatentGuide) at the final frame
  index -- meant to fight identity/likeness drift across a long single-image-driven
  talking clip. "Text To Video (no image ref)" boolean (fixed false = i2v mode in
  this JSON) toggles bypassing both image-conditioning nodes for pure t2v -- not flaggable
  (bool), noted here since it explains the "t2v" in this workflow''s name. "USE VOCALS
  ONLY" (vocal isolation via Mel-Band RoFormer vs. the raw trimmed audio) is a boolean
  switch, fixed true, not flaggable. Segment/audio total length is duplicated as 4
  independent hardcoded "481"-frame literals (839 max_frames, 749 EmptyLTXVLatentVideo
  length, 751 LTXVEmptyLatentAudio frames_number, and a "PrimitiveInt" node feeding
  the audio-trim-duration calculator) that must be kept manually in sync with timeline_data''s
  own segment lengths if you change them -- not flagged individually since no single
  param controls all four. local_prompts/segment_lengths on the timeline node are
  literal duplicates of timeline_data''s own segments (also must stay in sync, same
  convention as this workflow''s already-onboarded sibling manifests). Base pass ->
  LTXVLatentUpsampler spatial-upscale second pass -> single VHS_VideoCombine save
  (only one save node exists, so output selection is unambiguous).

  '
workflow: movie-maker-prompt-relay-custom-audio-i2v-t2v-short-story-promptrelay-timeline-custom-audio-latent-guider.json
mode: [i2v, t2v]
output_node_title: "Video Combine \U0001F3A5\U0001F165\U0001F157\U0001F162"
flags:
  image1:
    node_title: Load Image
    param: image
    type: image
    required: true
    help: Single reference/keyframe image, used both for i2v conditioning and re-encoded
      as the identity-anchoring latent guide.
    node: '584'
  global_prompt:
    node_title: Prompt Relay Encode (Timeline)
    param: global_prompt
    type: str
    required: false
    default: Cinematic. High quality. Movie photography
    node: '839'
  timeline_data:
    node_title: Prompt Relay Encode (Timeline)
    param: timeline_data
    type: str
    required: false
    default: '{"segments":[{"prompt":"The man, The Joker, is talking on the phone.
      \n\nHe talks with perfect lip-sync to the attached audio.\nHe talks with an
      expressive face and gesticulate as he talk.\nThe camera slowly pulls in towards
      his face. \n","length":121,"color":"#4f8edc"},{"prompt":"The man, The Joker,
      is talking on the phone. The camera pulls out slowly with smooth motion and
      shows him sitting at the edge of a high rise building.\n\nHe talks with perfect
      lip-sync to the attached audio.\nHe talks with an expressive face and gesticulate
      as he talk.\n","length":120,"color":"#e07b3a"},{"prompt":"The man, The Joker,
      is talking on the phone.  The camera slowly pans above him, showing a breath-taking
      altitude from where he is sitting, at rooftop edge of a high rise building,
      with view down towards the city ground. \n\nHe talks with perfect lip-sync to
      the attached audio.\nHe talks with an expressive face and gesticulate as he
      talk.\n","length":120,"color":"#5cb85c"},{"prompt":"Scene change/scene cut:
      Camera is at a front view close up of the man, The Joker, is talking on the
      phone.\n\nHe talks with perfect lip-sync to the attached audio.\nHe talks with
      an expressive face and gesticulate as he talk.\n","length":120,"color":"#d9534f"}]}'
    node: '839'
  latent_guide_strength:
    node_title: "\U0001F15B\U0001F163\U0001F167 LTXV Add Latent Guide"
    param: strength
    type: float
    required: false
    default: 1
    help: Strength of the extra identity-anchoring latent guide re-injected from the
      source image -- this workflow's defining 'latent guider' technique.
    node: '4154'
  image_strength_pass1:
    node_title: 'LTXVImgToVideoInplace #810'
    param: strength
    type: float
    required: false
    default: 1
    help: Image-conditioning strength on the base (first) sampling pass.
    node: '810'
  image_strength_pass2:
    node_title: 'LTXVImgToVideoInplace #767'
    param: strength
    type: float
    required: false
    default: 0.7
    help: Image-conditioning strength on the spatial-upsampler (second) sampling pass.
    node: '767'
  audio:
    node_title: Load Audio
    param: audio
    type: str
    required: false
    default: Taken Phone Speech [HD].wav
    help: Backing/lip-sync audio track. Must already exist in ComfyUI's input directory
      -- no upload path for audio in this CLI.
    node: '4123'
  audio_start_seconds:
    node_title: START AUDIO FROM
    param: start_index
    type: int
    required: false
    default: 16
    help: Offset (seconds) into the loaded audio file where the trimmed clip used
      for the final video begins.
    node: '4126'
  seed_pass1:
    node_title: 'RandomNoise #773'
    param: noise_seed
    type: int
    required: false
    default: 43
    help: Seed for the base (first) sampling pass.
    node: '773'
  seed_pass2:
    node_title: 'RandomNoise #774'
    param: noise_seed
    type: int
    required: false
    default: 31
    help: Seed for the spatial-upsampler (second) sampling pass.
    node: '774'
  width:
    node_title: WIDTH
    param: value
    type: int
    required: false
    default: 960
    node: '699'
  height:
    node_title: HEIGHT
    param: value
    type: int
    required: false
    default: 544
    node: '701'
  fps:
    node_title: FPS
    param: value
    type: float
    required: false
    default: 24
    node: '697'
