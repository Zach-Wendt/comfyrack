description: 'LTX-2.3 t2v/r2v (reference-to-video) workflow: a single character-sheet
  reference image drives BOTH a dedicated ''character sheet'' Face-ID LoRA and the
  general Face-ID LoRA (stacked), combined with a free-form text prompt to generate
  a talking/acting video of that character. The graph also has an optional ''Prompt
  Enhancer'' toggle that runs a vision-LLM (TextGenerate node) to auto-merge visible
  face/body/clothing details from the reference image into the prompt before generation
  -- not exposed as a flag (boolean isn''t a supported flag type; defaults on). 2-pass:
  base pass uses a fixed 9-value manual sigma schedule (no scalar steps to flag),
  refine/upscale pass uses a fixed 4-value schedule; both CFGGuiders are pinned to
  1.'
workflow: multi-ref-character-sheet-t2v-r2v-character-sheet-best-face-id-lora.json
mode: [r2v, t2v]
output_node_title: "Video Combine \U0001F3A5\U0001F165\U0001F157\U0001F162"
flags:
  character_sheet_ref:
    node_title: CHARACTER SHEET
    param: image
    type: image
    required: true
    help: Character-sheet/identity reference image driving BOTH stacked Face-ID LoRAs.
    node: '104'
  positive_prompt:
    node_title: Positive Prompt
    param: value
    type: str
    required: false
    default: "ref_t2v:  A gorgeous female explorer with blonde hair is walking high\
      \ up in tall norwegian mountains with a stunning scenery in the background.\
      \ Tracking camera as she walks in a small path in the terrterrain.\n\nShe stops\
      \ and takes a break. Camera pulls in toward her face.\nShe talks and she says:\
      \ \"So now its your turn, go try out the new Face ID lora, and  make your character\
      \ explore new worlds\". \n\nThe camera pulls out, to a majestic panoramic view\
      \ of the stunning norwegian mountain landscape"
    node: '102'
  negative_prompt:
    node_title: CLIP Text Encode (Prompt)
    param: text
    type: str
    required: false
    default: pc game, console game, video game, cartoon, childish, ugly, artifacts,
      low resolution, blurry, jagged edges
    node: '35'
  seed:
    node_title: 'RandomNoise #50'
    param: noise_seed
    type: int
    required: false
    default: 43
    node: '50'
  refine_seed:
    node_title: 'RandomNoise #131'
    param: noise_seed
    type: int
    required: false
    default: 42
    node: '131'
  width:
    node_title: WIDTH
    param: value
    type: int
    required: false
    default: 1280
    node: '2265'
  height:
    node_title: HEIGHT
    param: value
    type: int
    required: false
    default: 736
    node: '2266'
  length_seconds:
    node_title: LENGTH (in seconds)
    param: value
    type: int
    required: false
    default: 10
    node: '2263'
  fps:
    node_title: FPS
    param: value
    type: float
    required: false
    default: 24
    node: '2259'
  charactersheet_faceid_lora_strength:
    node_title: Face ID - CHARACTER SHEET LORA
    param: strength_model
    type: float
    required: false
    default: 1
    help: Strength of the Best_FaceID_CharacterSheet_v1.0 LoRA (tuned specifically
      for character-sheet-style reference images).
    node: '2228'
  faceid_lora_strength:
    node_title: Face ID LORA
    param: strength_model
    type: float
    required: false
    default: 0.5
    help: Strength of the general Best_FaceID_v1.0 LoRA, stacked on top of the character-sheet
      LoRA.
    node: '2245'
  filename_prefix:
    node_title: "Video Combine \U0001F3A5\U0001F165\U0001F157\U0001F162"
    param: filename_prefix
    type: str
    required: false
    default: LTX-2
    node: '2308'
