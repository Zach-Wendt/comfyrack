description: 'LTX-2.3 i2v/t2v talking-avatar pipeline built around Omni Voice multi-speaker
  voice cloning: a two-speaker TTS script ("Audio Prompt", plain "[Speaker_N]:" tags,
  no emotion tags) is synthesized against two reference clips ("Load Audio - Speaker
  1"/"Load Audio - Speaker 2") by the Omni Voice TTS node -- that node (id 1942) has
  NO class_type and an empty _meta in this exported JSON (the UI->API converter evidently
  couldn''t resolve this custom node), so it has no title to flag against directly;
  this manifest instead flags its upstream literal-holding primitive nodes ("Audio
  Prompt", "Load Audio - Speaker 1/2"), which is equivalent and safe since those are
  simple literals feeding straight into it. The resulting cloned dialogue audio drives
  lip-synced AV-latent conditioning of a single reference image (a news-anchor plate)
  across two i2v passes (base pass + LTXVLatentUpsampler spatial-upscale second pass).
  The separate "PROMPT" text (video motion/visual description, itself containing an
  illustrative copy of the dialogue for the prompt-enhancer''s context) is DECOUPLED
  from the actual TTS script -- keep them in sync manually for correct lip-sync content.
  "ENABLE PROMPT ENHANCER" (default FALSE in this workflow, unlike its Fish-Audio-Pro/Qwen-TTS
  siblings: routes "PROMPT" through a Gemma vision-LLM using the source image as context
  before use, when enabled) and "Text To Video (no image ref)" (default false = i2v
  mode) are boolean switches, not flaggable, noted here. Only one VHS_VideoCombine
  save node exists, so output selection is unambiguous.

  '
workflow: talking-avatar-tts-i2v-t2v-talking-avatar-voice-clone-with-omnivoice-tts.json
mode: [i2v, t2v]
output_node_title: "Video Combine \U0001F3A5\U0001F165\U0001F157\U0001F162"
flags:
  image1:
    node_title: Load Image
    param: image
    type: image
    required: true
    help: News-anchor/avatar reference plate that gets animated and lip-synced.
    node: '444'
  video_prompt:
    node_title: PROMPT
    param: value
    type: str
    required: false
    default: "A video from a TV broadcast with a male and a female news achor. They\
      \ both stay in frame all the time.\n\nThe dialog from the male and female is\
      \ as follows:\n\n[Woman]: \"So wouldn't it be great with consistent multi speaker\
      \ audio?\"\n[Man]: \"Ah yes, and now you can. With Omni Voice. Create the audio\
      \ you need on the fly.\"\n[Woman]: \"Ich spreche Deutsch\"\n[Man]: \"I have\
      \ no idea what she just said, sound all greek to me.\" \n\nThe dialog with perfect\
      \ lip-sync to the audio\n\n\nThey both smile at the end.\n\n\n"
    help: Visual/motion description for the video, including an illustrative copy
      of the dialogue (used verbatim if prompt-enhancer is off, or as raw input to
      the enhancer LLM if on).
    node: '1624'
  tts_script:
    node_title: Audio Prompt
    param: value
    type: str
    required: false
    default: '[Speaker_1]: So wouldn''t it be great with consistent multi speaker
      audio?

      [Speaker_2]: Ah yes, and now you can. With Omni Voice. Create the audio you
      need on the fly.

      [Speaker_1]: Ich spreche Deutsch

      [Speaker_2]: I have no idea what she just said, sound all greek to me.'
    help: 'The actual multi-speaker TTS script synthesized by Omni Voice, using plain
      [Speaker_N]: tags.'
    node: '1947'
  speaker1_reference_audio:
    node_title: Load Audio - Speaker 1
    param: audio
    type: str
    required: false
    default: 0cec9f6991bb440db7fffb1b44d2ba72.mp3
    help: Reference clip for speaker 1's cloned voice. Must already exist in ComfyUI's
      input directory -- no upload path for audio in this CLI.
    node: '1943'
  speaker2_reference_audio:
    node_title: Load Audio - Speaker 2
    param: audio
    type: str
    required: false
    default: 04c0ee18ae1342e2a52688bfceefcc5f.mp3
    help: Reference clip for speaker 2's cloned voice. Must already exist in ComfyUI's
      input directory -- no upload path for audio in this CLI.
    node: '1944'
  negative_prompt:
    node_title: 'CLIP Text Encode (Prompt) #1626'
    param: text
    type: str
    required: false
    default: text, subtitles, logo, still image, still video, no motion, static, frozen,
      blurry, low quality, distorted, bad anatomy, oversaturated, pixelated, low resolution,
      grainy, compression artifacts, jpeg artifacts, glitches, watermark, signature,
      copyright,  distortedsound, saturated sound, loud sound , deformed facial features,
      asymmetrical face, missing facial features, extra limbs, disfigured hands, blurry
      teeth, disfigured teeth
    node: '1626'
  seed_base_pass:
    node_title: 'RandomNoise #1842'
    param: noise_seed
    type: int
    required: false
    default: 42
    help: Seed for the base (first) sampling pass.
    node: '1842'
  seed_upsample_pass:
    node_title: 'RandomNoise #1832'
    param: noise_seed
    type: int
    required: false
    default: 420
    help: Seed for the spatial-upsampler (second) sampling pass.
    node: '1832'
  image_strength_base_pass:
    node_title: 'LTXVImgToVideoInplace #1934'
    param: strength
    type: float
    required: false
    default: 0.7
    help: Image-conditioning strength on the base (first) sampling pass.
    node: '1934'
  image_strength_upsample_pass:
    node_title: 'LTXVImgToVideoInplace #1825'
    param: strength
    type: float
    required: false
    default: 1
    help: Image-conditioning strength on the spatial-upsampler (second) sampling pass.
    node: '1825'
  length_seconds:
    node_title: LENGTH (in seconds)
    param: value
    type: int
    required: false
    default: 10
    node: '1583'
  width:
    node_title: WIDTH
    param: value
    type: int
    required: false
    default: 1280
    node: '1606'
  height:
    node_title: HEIGHT
    param: value
    type: int
    required: false
    default: 720
    node: '1591'
  fps:
    node_title: FPS
    param: value
    type: float
    required: false
    default: 24
    node: '1586'
