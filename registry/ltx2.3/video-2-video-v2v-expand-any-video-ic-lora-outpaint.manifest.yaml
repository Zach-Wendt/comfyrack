description: 'Video-to-video canvas expansion (LTX-2.3 Outpaint IC-LoRA): pads the
  input clip''s frame by the given left/right/top/bottom margins and generates new
  pixel content to fill the expanded canvas, keeping the original audio. Single unambiguous
  VHS_VideoCombine output.'
workflow: video-2-video-v2v-expand-any-video-ic-lora-outpaint.json
mode: [v2v]
output_node_title: "Video Combine \U0001F3A5\U0001F165\U0001F157\U0001F162"
flags:
  prompt:
    node_title: Prompt
    param: value
    type: str
    default: "Cinematic video of  a stingray moving under water.  Tracking camera.\
      \ \n\nThe view is partly below water surface, and partly above water surface.\
      \ Above the water a tropical cabin can be seen in the distance at a small tropical\
      \ island. \n\nSound of water, and the singray, as well as sound of sea and tropical\
      \ nature above water. "
    help: Scene description used to generate the outpainted (expanded) frame area.
    node: '5216'
  negative_prompt:
    node_title: CLIP Text Encode (Negative Prompt)
    param: text
    type: str
    default: text, subtitles, logo, low quality, distorted, bad anatomy, oversaturated,
      pixelated, low resolution, grainy, compression artifacts, jpeg artifacts, glitches,
      watermark, signature, copyright,  distortedsound, saturated sound, loud sound
      , deformed facial features, asymmetrical face, missing facial features, extra
      limbs, disfigured hands, blurry teeth, disfigured teeth
    node: '2612'
  prompt_enhancer_instruction:
    node_title: LTX-2 PROMPT INSTRUCT
    param: value
    type: str
    default: ''
    help: Extra free-form instruction appended before the prompt when the LTX-2 prompt
      enhancer (ENABLE PROMPT ENHANCER, on by default) runs; empty by default.
    node: 5205:484
  seed:
    node_title: RandomNoise
    param: noise_seed
    type: int
    default: 42
    node: '4832'
  source_video:
    node_title: "Load Video FFmpeg (Upload) \U0001F3A5\U0001F165\U0001F157\U0001F162"
    param: video
    type: str
    default: 450x_auto__ (2) (1) (1).mp4
    help: Filename of source video; must already exist in ComfyUI's input directory
      (no upload path for video yet in this CLI).
    node: '5207'
  fps:
    node_title: FPS
    param: value
    type: float
    default: 24
    node: '5133'
  outpaint_left:
    node_title: LEFT
    param: value
    type: int
    default: 300
    help: Pixels to expand on the left edge.
    node: '5281'
  outpaint_right:
    node_title: RIGHT
    param: value
    type: int
    default: 300
    help: Pixels to expand on the right edge.
    node: '5282'
  outpaint_top:
    node_title: TOP
    param: value
    type: int
    default: 0
    help: Pixels to expand on the top edge.
    node: '5283'
  outpaint_bottom:
    node_title: BOTTOM
    param: value
    type: int
    default: 0
    help: Pixels to expand on the bottom edge.
    node: '5284'
  output_max_size:
    node_title: OUTPUT MAX SIZE (longer side)
    param: value
    type: int
    default: 1280
    help: Cap on the longer output side after outpaint expansion.
    node: '5174'
  outpaint_lora_strength:
    node_title: "\U0001F15B\U0001F163\U0001F167 IC-LoRA Loader Model Only"
    param: strength_model
    type: float
    default: 1
    help: Strength of the outpaint IC-LoRA.
    node: '5011'
