description: 'LTX-2.3 experimental "dev" image-to-video with custom-audio-conditioned
  sync (e.g. lip-sync a performance to a music track): a caller-supplied audio clip
  is trimmed, optionally vocal-isolated ("USE ONLY VOCALS", default off, not exposed
  -- no bool flag type), and VAE-encoded as a noise mask that seeds the audio latent,
  gated by "Custom Audio on TRUE" (default true, not exposed). Unlike the sibling
  custom-audio-i2v-t2v-basic-* workflows, the FINAL output audio here is the model''s
  own regenerated decode of that conditioned latent (node 201), not the raw input
  clip muxed in verbatim -- so the model reproduces/re-sings the audio rather than
  passing it through untouched. Base pass uses a multimodal (video+audio) guider gated
  by "USE MULTIMODAL GUIDE" (default true, not exposed). Also includes the same in-graph
  Gemma prompt-enhancer subgraph as the other "dev" workflows in this batch (gated
  by "ENABLE PROMPT ENHANCER", default on, not exposed).

  '
workflow: custom-audio-i2v-t2v-dev-custom-audio.json
mode: [i2v, t2v]
output_node_title: "Video Combine \U0001F3A5\U0001F165\U0001F157\U0001F162"
flags:
  positive_prompt:
    node_title: PROMPT
    param: value
    type: str
    default: "Make this image come alive with cinematic motion, smooth animation.\
      \ Cinematic video.\n\nScene:  a beautiful woman with guitar is playing and singing\
      \ on stage. \n\nShe sings and plays with perfect sync to the attached audio.\n\
      \nBehind her the stage light flashes dynamically with stage smoke floating through\
      \ the air. \n\nShe plays with dynamic body movements and body language reflecting\
      \ that its a rock music song she is performing. "
    help: Raw user prompt. Feeds the CLIP text encoder directly if the prompt enhancer
      is off, or is folded into the Gemma-rewritten prompt if it's on -- either way
      this is the flag that actually changes the result.
    node: '352'
  negative_prompt:
    node_title: Negative Prompt
    param: text
    type: str
    default: blurry, oversaturated, pixelated, low resolution, grainy, distorted,
      noise, compression artifacts, jpeg artifacts, glitches, watermark, text, logo,
      signature, copyright, subtitles, distorted sound, saturated sound, loud
    node: '110'
  image:
    node_title: Load Image
    param: image
    type: image
    required: true
    help: First-frame reference image for i2v conditioning. Ignored if the JSON's
      'Text To Video (no image ref)' bypass toggle (node 290) is flipped to true --
      that toggle is not exposed here.
    node: '167'
  custom_audio_file:
    node_title: Load Audio
    param: audio
    type: str
    default: 2Azk6gnh_Tu6m8Vvqa_As_01.mp3
    help: Must already exist in ComfyUI's input directory -- no upload path exists
      for audio yet in this CLI. Drives the audio-conditioning latent (see description);
      the final output audio is the model's own regenerated decode, not this file
      verbatim.
    node: '2049'
  seed_pass1:
    node_title: 'RandomNoise #115'
    param: noise_seed
    type: int
    default: 42
    help: Seed for the base pass.
    node: '115'
  seed_pass2:
    node_title: 'RandomNoise #114'
    param: noise_seed
    type: int
    default: 43
    help: Seed for the upscale/refine pass.
    node: '114'
  width:
    node_title: WIDTH
    param: value
    type: int
    default: 736
    node: '292'
  height:
    node_title: HEIGHT
    param: value
    type: int
    default: 1280
    node: '293'
  length_seconds:
    node_title: LENGTH (in seconds)
    param: value
    type: int
    default: 14
    node: '291'
  fps:
    node_title: FPS
    param: value
    type: float
    default: 24
    node: '285'
  steps:
    node_title: BasicScheduler
    param: steps
    type: int
    default: 30
    help: Only drives the base-pass (pass 1) step count -- pass 2 uses a fixed hand-authored
      sigma schedule (ManualSigmas) unaffected by this flag.
    node: '395'
  video_cfg:
    node_title: Video CFG
    param: value
    type: float
    default: 3
    help: Only affects pass 1's multimodal guider (video branch) -- pass 2 uses a
      distilled model hard-coded to cfg=1 in the JSON.
    node: '433'
  audio_cfg:
    node_title: Audio CFG
    param: value
    type: float
    default: 7
    help: Only affects pass 1's multimodal guider (audio branch).
    node: '435'
