    param: value
    type: int
    required: false
    default: 8
    node: '875'
  negative_prompt:
    node_title: Negative Prompt
    param: text
    type: str
    required: false
    default: blurry, oversaturated, pixelated, low resolution, grainy, distorted,
      noise, compression artifacts, jpeg artifacts, glitches, watermark, text, logo,
      signature, copyright, subtitles, distorted sound, saturated sound, loud
    node: '777'
  audio:
    node_title: Load Audio
    param: audio
    type: str
    required: false
    default: comfy lofi song_.mp3
    help: Custom audio track (lip-sync source). Must already exist in ComfyUI's input
      directory -- no upload path for audio in this CLI.
    node: '953'
  audio_start_seconds:
    node_title: START AUDIO FROM
    param: start_index
    type: int
    required: false
    default: 22
    help: Offset (seconds) into the loaded audio file where the trimmed clip used
      for the final video begins; duration is computed automatically from the total
      video length.
    node: '956'
  seed_pass1:
    node_title: 'RandomNoise #773'
    param: noise_seed
    type: int
    required: false
    default: 43
    help: Seed for the base (first) sampling pass.
    node: '773'
  seed_pass2:
    node_title: 'RandomNoise #774'
    param: noise_seed
    type: int
    required: false
    default: 42
    help: Seed for the spatial-upsampler (second) sampling pass.
    node: '774'
  width:
    node_title: WIDTH
    param: value
    type: int
    required: false
    default: 1280
    node: '699'
  height:
