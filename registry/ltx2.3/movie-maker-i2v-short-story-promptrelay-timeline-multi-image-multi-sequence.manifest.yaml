      \" so this first segment should be 8 seconds. hopefully ...\" \n\nIts raining.\n\nAt
      the end, scene cut to a new scene. ","length":204,"color":"#4f8edc"},{"prompt":"A
      man called Tom, is waiting, leaning up against the wall. He talks with a rusty
      deep american accent, and he says:  \"and i wonder if i can raise 8... so I
      end at 16\". \n\nIts raining.\n\nAt the end, scene cut to a new scene. ","length":192,"color":"#e07b3a"},{"prompt":"Tom
      and Elsa have met up. The man says : \"are we at 16 now ? 8 plus 8 should be\".  \n\nThe
      woman says: \"you are right mister\". \n\nIts raining.\n\nAt the end, scene
      cut to a new scene. ","length":156,"color":"#5cb85c"},{"prompt":"Tom and Elsa
