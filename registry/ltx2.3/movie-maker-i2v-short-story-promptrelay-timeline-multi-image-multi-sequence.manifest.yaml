description: 'LTX-2.3 i2v "Movie Maker" short-story pipeline with 4 DISTINCT reference/keyframe
  images (one per scene, titled "SEGMENT 1".."SEGMENT 4"), driven by a "Prompt Relay
  Encode (Timeline)" node (global_prompt + timeline_data JSON of {prompt,length,color}
  segments). NOTE: the real, structurally-load-bearing per-segment length control
  is NOT timeline_data''s embedded "length" field -- it''s 4 separate "SEGMENT N -
  FRAMES" INTConstant nodes that feed both the per-image guide-insertion frame index
  (LTXVAddGuideMulti) AND the total-frame calculator that sizes EmptyLTXVLatentVideo/LTXV
  Empty Latent Audio; timeline_data''s own lengths were observed OUT OF SYNC with
  these (204/192/156/121 vs the SEGMENT-FRAMES nodes'' 192/192/168/121) in the shipped
  JSON, so edit the SEGMENT N - FRAMES flags for real length control, not timeline_data''s
  numbers. Uses ConditioningZeroOut for the negative branch (no editable negative-prompt
  text node exists). Base pass -> LTXVLatentUpsampler spatial-upscale second pass
  -> single VHS_VideoCombine save (only one save node exists, so output selection
  is unambiguous).

  '
workflow: movie-maker-i2v-short-story-promptrelay-timeline-multi-image-multi-sequence.json
mode: [i2v]
output_node_title: "Video Combine \U0001F3A5\U0001F165\U0001F157\U0001F162"
