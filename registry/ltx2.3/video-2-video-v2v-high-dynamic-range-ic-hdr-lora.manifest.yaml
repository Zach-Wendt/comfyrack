description: 'Video-to-video HDR conversion (LTX-2.3 HDR IC-LoRA): regrades the input
  clip to high-dynamic-range footage. Two dead-end VHS_VideoCombine nodes exist --
  #5203 (images from LTXVHDRDecodePostprocess, the true HDR-graded decode, also written
  as EXR frames to output/hdr_exr3) and #5235 (images from HDRPreviewKJ, an SDR tone-mapped
  ''HDR Preview KJ'' node for on-screen viewing only) -- picked #5203 as the real
  HDR deliverable, #5235 is a viewer-friendly preview.'
workflow: video-2-video-v2v-high-dynamic-range-ic-hdr-lora.json
mode: [v2v]
output_node_title: "Video Combine \U0001F3A5\U0001F165\U0001F157\U0001F162 #5203"
flags:
  positive_prompt:
    node_title: CLIP Text Encode (Positive Prompt)
    param: text
    type: str
    default: HDR footage
    node: '2483'
  negative_prompt:
    node_title: CLIP Text Encode (Negative Prompt)
    param: text
    type: str
    default: pc game, console game, video game, ugly, still, static, slow
    node: '2612'
  seed:
    node_title: RandomNoise
    param: noise_seed
    type: int
    default: 42
    node: '4832'
  source_video:
    node_title: "Load Video FFmpeg (Upload) \U0001F3A5\U0001F165\U0001F157\U0001F162"
    param: video
    type: str
    default: LTX-2_01532-audio.mp4
    help: Filename of source video; must already exist in ComfyUI's input directory
      (no upload path for video yet in this CLI).
    node: '5171'
  fps:
    node_title: FPS
    param: value
    type: float
    default: 24
    node: '5145'
  max_size:
    node_title: MAX SIZE (longest)
    param: value
    type: int
    default: 960
    node: '5143'
  max_length_seconds:
    node_title: MAX LENGTH (seconds)
    param: value
    type: int
    default: 12
    node: '5148'
  hdr_lora_strength:
    node_title: "\U0001F15B\U0001F163\U0001F167 IC-LoRA Loader Model Only"
    param: strength_model
    type: float
    default: 1
    help: Strength of the HDR IC-LoRA.
    node: '5234'
  hdr_exposure:
    node_title: LTXVHDR Decode Postprocess
    param: exposure
    type: float
    default: 7.1
    help: Exposure value used by the HDR decode postprocess -- the central tone-mapping
      knob.
    node: '5114'
