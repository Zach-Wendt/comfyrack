description: LTX-2.3 minimal single-pass text-to-video generator -- no reference image,
  no latent-upscale refinement pass (unlike t2v-basic's two-pass version), just one
  sampling pass with LTX's own generated audio, saved as one MP4. Only one save node
  exists (Video Combine). The JSON also contains a disconnected/bypassed alternate
  GGUF unet+clip loader pair (dead-end, not on the active execution path) -- not flagged.
workflow: t2v-simple-single-pass.json
mode: [t2v]
output_node_title: "Video Combine \U0001F3A5\U0001F165\U0001F157\U0001F162"
flags:
  prompt:
    node_title: PROMPT
    param: value
    type: str
    required: false
    default: "Make this image come alive with fluid motion. \n\nA beautiful blonde\
      \ woman smiles towards the viewer.\n\nThen she talks and says with a soft female\
      \ british voice : \"Lets go making some great videos with LTX 2.3\".\n\n\nSteady\
      \ camera slowly panning in towards the main subject. \nThe scene is set to a\
      \ sunny windy day outside with the city in the background. Ambient low volume\
      \ city sound in the background. "
    help: Scene/action/dialogue description -- passed through the local Generate LTX2
      Prompt (LLM) node for enhancement before encoding.
    node: '352'
  negative_prompt:
    node_title: 'CLIP Text Encode (Prompt) #110'
    param: text
    type: str
    required: false
    default: blurry, oversaturated, pixelated, low resolution, grainy, distorted,
      noise, compression artifacts, jpeg artifacts, glitches, watermark, text, logo,
      signature, copyright, subtitles, distorted sound, saturated sound, loud
    node: '110'
  seed:
    node_title: RandomNoise
    param: noise_seed
    type: int
    required: false
    default: 44
    node: '115'
  width:
    node_title: WIDTH
    param: value
    type: int
    required: false
    default: 960
    node: '292'
  height:
    node_title: HEIGHT
    param: value
    type: int
    required: false
    default: 544
    node: '293'
  length_seconds:
    node_title: LENGTH (in seconds)
    param: value
    type: int
    required: false
    default: 10
    node: '291'
  fps:
    node_title: FPS
    param: value
    type: float
    required: false
    default: 24
    node: '285'
