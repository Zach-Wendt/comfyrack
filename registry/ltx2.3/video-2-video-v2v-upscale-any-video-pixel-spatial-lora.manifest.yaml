description: 'Video-to-video upscaling (LTX-2.3 Pixel Spatial Upscaler x2 IC-LoRA):
  re-renders the input clip at higher spatial detail/resolution (fixed 2x IC-LoRA;
  max_size caps the final longest edge). Single unambiguous VHS_VideoCombine output.'
workflow: video-2-video-v2v-upscale-any-video-pixel-spatial-lora.json
mode: [v2v]
output_node_title: "Video Combine \U0001F3A5\U0001F165\U0001F157\U0001F162"
flags:
  positive_prompt:
    node_title: CLIP Text Encode (Positive Prompt)
    param: text
    type: str
    default: 'A strange creature with only one big eye in a dark lit room, looking
      around confused '
    node: '2483'
  negative_prompt:
    node_title: CLIP Text Encode (Negative Prompt)
    param: text
    type: str
    default: pc game, console game, video game, cartoon, childish, ugly
    node: '2612'
  seed:
    node_title: RandomNoise
    param: noise_seed
    type: int
    default: 43
    node: '4967'
  source_video:
    node_title: "Load Video FFmpeg (Upload) \U0001F3A5\U0001F165\U0001F157\U0001F162"
    param: video
    type: str
    default: 450x_auto__ (4).mp4
    help: Filename of source video; must already exist in ComfyUI's input directory
      (no upload path for video yet in this CLI).
    node: '5106'
  fps:
    node_title: FPS
    param: value
    type: float
    default: 24
    node: '5119'
  max_size:
    node_title: MAX SIZE (Longest edge)
    param: value
    type: int
    default: 1920
    help: Cap on the longest output edge after the 2x pixel-spatial upscale -- the
      effective upscale target resolution (the IC-LoRA itself is a fixed x2 upscaler,
      there is no separate scale-factor knob in this graph).
    node: '5120'
  max_length_seconds:
    node_title: MAX LENGTH (in seconds)
    param: value
    type: int
    default: 10
    node: '5124'
  upscaler_lora_strength:
    node_title: Pixel Spatial Upscaler Lora
    param: strength_model
    type: float
    default: 1
    help: Strength of the Pixel Spatial Upscaler (x2) IC-LoRA.
    node: '5016'
