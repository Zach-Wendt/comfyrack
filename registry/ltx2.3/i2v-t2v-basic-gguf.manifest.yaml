description: 'Same two-pass core image-to-video pipeline as i2v-t2v-basic, but sourcing
  the transformer + text encoder from GGUF-quantized loaders (UnetLoaderGGUF + DualCLIPLoaderGGUF,
  LTX-2.3-22B-distilled-1.1 Q5_K_M / gemma-3-12b-it Q5_K_M -- bumped 2026-07-23 from
  the original Q4_K_S/Q2_K, source: Abiray/LTX-2.3-22B-DISTILLED-1.1-GGUF + unsloth/gemma-3-12b-it-GGUF,
  both byte-verified) instead of the fp8 safetensors loaders -- for lower-VRAM setups
  than i2v-t2v-basic while staying at a meaningfully higher quant floor than the original
  Q2_K text encoder. Unlike i2v-t2v-basic, there is no LLM prompt-enhancer chain here:
  the positive prompt is used verbatim. Despite the "t2v" in its name, this manifest
  only exposes the i2v path -- the JSON''s own "Text To Video (no image ref)" boolean
  toggle isn''t exposed as a flag (no bool flag type in this schema), so pure text-to-video
  mode needs a direct JSON edit; `image` is required here.

  '
workflow: i2v-t2v-basic-gguf.json
mode: [i2v, t2v]
output_node_title: "Video Combine \U0001F3A5\U0001F165\U0001F157\U0001F162"
flags:
  positive_prompt:
    node_title: 'CLIP Text Encode (Prompt) #121'
    param: text
    type: str
    required: false
    default: "A woman at a chair and looks towards the camera.\n\n0-4 seconds : She\
      \ takes off her hat.\n\n4-8 seconds:\nShe talks with a soft British accent and\
      \ says \"So due to recent changes, here is a workflow with new model loaders\"\
      .\n\n10-10 seconds: She smiles and lift one hand to make a peace sign with her\
      \ fingers.\n\nStyle: \nWes Anderson style, rigid, centered symmetry, pastel\
      \ color palette, whimsical, nostalgic aesthetic."
    help: Used verbatim as the positive conditioning text -- this variant has no LLM
      prompt-enhancer chain.
    node: '121'
  negative_prompt:
    node_title: 'CLIP Text Encode (Prompt) #110'
    param: text
    type: str
    required: false
    default: blurry, oversaturated, pixelated, low resolution, grainy, distorted,
      noise, compression artifacts, jpeg artifacts, glitches, watermark, text, logo,
      signature, copyright, subtitles, distorted sound, saturated sound, loud
    node: '110'
  image:
    node_title: Load Image
    param: image
    type: image
    required: true
    help: Server-side upload ref of the starting frame -- caller uploads via cc.upload()
      first.
    node: '167'
  seed:
    node_title: 'RandomNoise #115'
    param: noise_seed
    type: int
    required: false
    default: 43
    help: Seed for the base (half-resolution) first pass.
    node: '115'
  seed_refine:
    node_title: 'RandomNoise #114'
    param: noise_seed
    type: int
    required: false
    default: 420
    help: Seed for the second (spatial-upscale + refine) pass.
    node: '114'
  width:
    node_title: WIDTH
    param: value
    type: int
    required: false
    default: 1280
    node: '292'
  height:
    node_title: HEIGHT
    param: value
    type: int
    required: false
    default: 736
    node: '293'
  length_seconds:
    node_title: LENGTH (in seconds)
    param: value
    type: int
    required: false
    default: 10
    node: '291'
  fps:
    node_title: FPS
    param: value
    type: float
    required: false
    default: 24
    node: '285'
