description: 'LTX-2.3 22B distilled i2v/t2v workflow using the Licon-MSR-V2 IC-LoRA
  for multi-subject-reference video generation: takes 2 character/object reference
  images plus a background/scene image, stitches them as IC-LoRA guide conditioning,
  and generates a video (with dialogue/action driven by PromptRelayEncode''s global_prompt/local_prompts
  scene-script format) placing the referenced subjects into the scene. Two-pass by
  default (base generation + LTXVLatentUpsampler refine pass); a ''Single pass'' boolean
  toggle node exists in the graph to skip the refine pass but isn''t exposed as a
  flag here (boolean isn''t a supported flag type).'
workflow: multi-ref-character-sheet-i2v-multi-subject-reference-licon-msr-v2-lora.json
mode: [i2v]
output_node_title: "Video Combine \U0001F3A5\U0001F165\U0001F157\U0001F162"
flags:
  ref_image_1:
    node_title: Ref Image 1
    param: image
    type: image
    required: true
    help: First multi-subject reference image (e.g. a character).
    node: '1273'
  ref_image_2:
    node_title: Ref Image 2
    param: image
    type: image
    required: true
    help: Second multi-subject reference image (e.g. an object/prop).
    node: '1267'
  background_scene:
    node_title: Background / Scene
    param: image
    type: image
    required: true
    help: Background/scene plate the referenced subjects get placed into.
    node: '1275'
  global_prompt:
    node_title: Prompt Relay Encode
    param: global_prompt
    type: str
    required: false
    default: "Figure 1: A British male soccer player wearing the English soccer uniform.\
      \ With Adidas logo and the Englsh flag on the chest area of the soccer shirt.\n\
      Figure 2: A gold throphy with a golden ball at top\nFigure 3:  A panoramic view\
      \ of a soccer stadium \n"
    help: 'Per-figure identity descriptions (Figure 1/2/3: ...) matching the reference
      images.'
    node: '180'
  local_prompts:
    node_title: Prompt Relay Encode
    param: local_prompts
    type: str
    required: false
    default: "The scene starts with a panoramic view of an empty soccer stadium. \n\
      \nMale A walks into frame and he talks with a British voice and says: \"I am\
      \ not Haaland, but I hope to score lots of goals for England in the final.\"\
      \n\nThen he bends his knees and picks up the golden throphy (figure 2) from\
      \ teh ground and lifts it over his head.\n\nHe then says: \"Lets bring this\
      \ baby home!\" \n\n"
    help: Scene script/action/dialogue describing what happens in the video.
    node: '180'
  negative_prompt:
    node_title: CLIP Text Encode (Prompt)
    param: text
    type: str
    required: false
    default: 'subtitles, watermark, worst quality, blurry, jittery, distorted, inconsistent
      appearance

      '
    node: '185'
  seed:
    node_title: 'RandomNoise #15'
    param: noise_seed
    type: int
    required: false
    default: 760358538587206
    node: '15'
  refine_seed:
    node_title: 'RandomNoise #1342'
    param: noise_seed
    type: int
    required: false
    default: 43
    node: '1342'
  width:
    node_title: WIDTH
    param: value
    type: int
    required: false
    default: 1536
    node: '203'
  height:
    node_title: HEIGHT
    param: value
    type: int
    required: false
    default: 832
    node: '204'
  length_seconds:
    node_title: LENGTH (in seconds)
    param: value
    type: int
    required: false
    default: 15
    node: '201'
  fps:
    node_title: FPS
    param: value
    type: float
    required: false
    default: 24
    node: '197'
  steps:
    node_title: BasicScheduler ( for more steps)
    param: steps
    type: int
    required: false
    default: 20
    help: Base-pass step count. The refine/upscale pass uses a fixed 4-value manual
      sigma schedule instead of a scalar steps count, not exposed as a flag.
    node: '1366'
  licon_msr_lora_strength:
    node_title: "\U0001F15B\U0001F163\U0001F167 IC-LoRA Loader Model Only"
    param: strength_model
    type: float
    required: false
    default: 1
    help: Strength of the Licon-MSR-V2 multi-subject-reference IC-LoRA -- the central
      technique this workflow is built around.
    node: '10'
  filename_prefix:
    node_title: "Video Combine \U0001F3A5\U0001F165\U0001F157\U0001F162"
    param: filename_prefix
    type: str
    required: false
    default: LTX
    node: '1343'
