description: 'LTX-2.3 i2v/t2v "long video" experimental pipeline (single-pass loop
  variant): a starting image is animated with a base pass (single sampler pass per
  segment, simpler than the sibling dual-pass "-loop" workflow), then extended via
  a real ComfyUI for-loop (easy forLoopStart/End, "LOOPS" = 4 iterations, "OVERLAP
  SECONDS" = 2) with custom-audio lip-sync. "Video Combine" is the base-pass preview
  save, "VIDEO FROM LAST LOOP"/"Current Lopp" are duplicate intra-loop debug saves
  of the current iteration''s own decode. The true end-to-end deliverable is "Final
  Video", fed from the for loop''s own terminal "For Loop End" node.

  '
workflow: long-video-experimental-i2v-t2v-long-video-custom-audio-singlepass-loop.json
mode: [i2v, t2v]
output_node_title: Final Video
flags:
  positive_prompt:
    node_title: PROMPT
    param: value
    type: str
    required: false
    default: "Scene: Static camera.\nCamera subtle panning sideways back and forth\
      \ while always having front view of the woman with her face in visible and in\
      \ focus. \n\nA beautiful female with guitar is singing and playing guitar, sitting\
      \ down at a chair. She sings with perfect lip-sync to the attached audio. \n\
      \nShe is singing a beautiful slow song with passionate expression at her face.\n\
      \nCinematic video with warm color tones from nearby lights.\n\n"
    node: '1624'
  negative_prompt:
    node_title: 'CLIP Text Encode (Prompt) #1626'
    param: text
    type: str
    required: false
    default: text, subtitles, logo, still image, still video, no motion, static, frozen,
      blurry, low quality, distorted, bad anatomy, oversaturated, pixelated, low resolution,
      grainy, compression artifacts, jpeg artifacts, glitches, watermark, signature,
      copyright,  distortedsound, saturated sound, loud sound , deformed facial features,
      asymmetrical face, missing facial features, extra limbs, disfigured hands, blurry
      teeth, disfigured teeth
    node: '1626'
  seed:
    node_title: Start Seed
    param: value
    type: int
    required: false
    default: 42
    node: '1527'
  image1:
    node_title: Load Image
    param: image
    type: image
    required: true
    help: Starting frame for the base pass, then extended by the for-loop.
    node: '444'
  audio:
    node_title: Load Audio
    param: audio
    type: str
    required: false
    default: Hallelujah - Lucy Thomas - (Official Music Video).mp3
    help: Custom audio track (lip-sync source). Must already exist in ComfyUI's input
      directory -- no upload path for audio in this CLI.
    node: '1594'
  loops:
    node_title: LOOPS
    param: value
    type: int
    required: false
    default: 4
    help: Number of times the extend for-loop iterates; directly controls total output
      length.
    node: '1611'
  overlap_seconds:
    node_title: 'OVERLAP SECONDS #1610'
    param: value
    type: int
    required: false
    default: 2
    node: '1610'
  length_seconds:
    node_title: LENGTH (in seconds)
    param: value
    type: int
    required: false
    default: 10
    help: Target length in seconds per extend segment.
    node: '1583'
  fps:
    node_title: FPS
    param: value
    type: float
    required: false
    default: 24
    node: '1586'
  width:
    node_title: WIDTH
    param: value
    type: int
    required: false
    default: 832
    node: '1606'
  height:
    node_title: HEIGHT
    param: value
    type: int
    required: false
    default: 480
    node: '1591'
