description: 'Full (non-distilled) step-count image-to-video pipeline on the LTX-2.3
  dev checkpoint -- 20-step BasicScheduler + MultimodalGuider ("USE MULTIMODAL GUIDE"
  fixed on) with independently tunable video/audio CFG, rather than the fixed few-step
  ManualSigmas schedule the distilled workflows use. A distilled-behavior LoRA is
  still layered on at two different partial strengths (base pass vs. upscale/refine
  pass) to keep it tractable. Two-pass like i2v-t2v-basic: base pass at half resolution,
  then 2x latent-upscale + refine at full resolution. Despite the "t2v" in its name,
  this manifest only exposes the i2v path -- the JSON''s own "Text To Video (no image
  ref)" boolean toggle isn''t exposed as a flag (no bool flag type in this schema),
  so pure text-to-video mode needs a direct JSON edit; `image` is required here.

  '
workflow: i2v-t2v-dev-full-steps.json
mode: [i2v, t2v]
output_node_title: "Video Combine \U0001F3A5\U0001F165\U0001F157\U0001F162"
flags:
  positive_prompt:
    node_title: PROMPT
    param: value
    type: str
    required: false
    default: "Make this image come alive with cinematic motion, smooth animation.\
      \ Cinematic video.\n\nScene: A beautiful is outdoors in the nature \n\nAction:\
      \ She starts to talk with a soft female british voice and she says : \"Do you\
      \ have the patience to wait for more steps to generate. Lets have a go with\
      \ the dev model from LTX\".\nThe woman is talking with perfect lips-sync.\n\n\
      Camera: Steady camera slowly pulls in towards the main subject. \n\nAtmosphere:\
      \ The scene is set to a windy outdoors with volumetric sunlight and deep shadows "
    help: Raw creative prompt -- gets run through the internal LLM prompt-enhancer
      (using the input image as visual context) before becoming the actual positive
      conditioning text.
    node: '352'
  negative_prompt:
    node_title: Negative Prompt
    param: text
    type: str
    required: false
    default: blurry, oversaturated, pixelated, low resolution, grainy, distorted,
      noise, compression artifacts, jpeg artifacts, glitches, watermark, text, logo,
      signature, copyright, subtitles, distorted sound, saturated sound, loud
    node: '110'
  image:
    node_title: Load Image
    param: image
    type: image
    required: true
    help: Server-side upload ref of the starting frame -- caller uploads via cc.upload()
      first.
    node: '167'
  steps:
    node_title: BasicScheduler
    param: steps
    type: int
    required: false
    default: 20
    help: Full diffusion step count for the base pass (this workflow's whole point
      vs. the distilled workflows, which use a fixed low-step manual sigma schedule
      instead). The refine pass keeps its own fixed schedule regardless.
    node: '395'
  video_cfg:
    node_title: Video CFG
    param: value
    type: float
    required: false
    default: 3
    node: '433'
  audio_cfg:
    node_title: Audio CFG
    param: value
    type: float
    required: false
    default: 7
    node: '435'
  lora_strength_base:
    node_title: 'Load LoRA #361'
    param: strength_model
    type: float
    required: false
    default: 0.3
    help: Distilled-behavior LoRA strength on the base (half-resolution) pass's model.
    node: '361'
  lora_strength_refine:
    node_title: 'Load LoRA #362'
    param: strength_model
    type: float
    required: false
    default: 0.6
    help: Distilled-behavior LoRA strength on the second (upscale/refine) pass's model.
    node: '362'
  seed:
    node_title: 'RandomNoise #115'
    param: noise_seed
    type: int
    required: false
    default: 42
    help: Seed for the base (half-resolution) first pass.
    node: '115'
  seed_refine:
    node_title: 'RandomNoise #114'
    param: noise_seed
    type: int
    required: false
    default: 43
    help: Seed for the second (spatial-upscale + refine) pass.
    node: '114'
  width:
    node_title: WIDTH
    param: value
    type: int
    required: false
    default: 1280
    node: '292'
  height:
    node_title: HEIGHT
    param: value
    type: int
    required: false
    default: 704
    node: '293'
  length_seconds:
    node_title: LENGTH (in seconds)
    param: value
    type: int
    required: false
    default: 10
    node: '291'
  fps:
    node_title: FPS
    param: value
    type: float
    required: false
    default: 24
    node: '285'
