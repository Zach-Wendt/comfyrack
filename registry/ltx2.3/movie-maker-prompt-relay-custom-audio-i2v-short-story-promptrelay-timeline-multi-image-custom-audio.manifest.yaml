      this image come alive with fluid motion. Cinematic music video shot of a red
      haired woman. \n\nShe sings with expressive motion and gesticulation. \nThe
      song she is singing is a sweet slow melancolic melody. Her lips moves in perfect
      lip-sync to the attached audio.  \n\nShe is walking through a romantic greenhouse
