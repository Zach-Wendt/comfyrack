description: 'LTX-2.3 i2v "Movie Maker" short-story pipeline with 4 DISTINCT reference/keyframe
  images (titled "SEGMENT 1".."SEGMENT 4", a lip-sync music-video sequence) plus a
  CUSTOM AUDIO track (trimmed to start at a chosen offset via "START AUDIO FROM"),
  driven by a "Prompt Relay Encode (Timeline)" node (global_prompt + timeline_data
  JSON of {prompt,length,color} segments). The 4 "SEGMENT N - FRAMES" INTConstant
  nodes are the structurally load-bearing per-segment length controls (feed guide-insertion
  frame indices + the total-frame calculator sizing EmptyLTXVLatentVideo); in this
  workflow''s shipped JSON they DO match timeline_data''s own embedded lengths (121/120/120/120),
  but timeline_data is edited/flagged separately for prompt text -- keep both in sync
  if you change segment length. Base pass -> LTXVLatentUpsampler spatial-upscale second
  pass -> single VHS_VideoCombine save (only one save node exists, so output selection
  is unambiguous).

  '
workflow: movie-maker-prompt-relay-custom-audio-i2v-short-story-promptrelay-timeline-multi-image-custom-audio.json
mode: [i2v]
output_node_title: "Video Combine \U0001F3A5\U0001F165\U0001F157\U0001F162"
