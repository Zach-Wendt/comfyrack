description: 'LTX-2.3 t2v/r2v workflow for direct audio-driven lip-sync: a face/character
  reference image (Best-Face-ID LoRA) plus a caller-supplied custom audio clip (vocals
  isolated via Mel-Band RoFormer by default) drive the character''s mouth/performance
  directly from the audio waveform, rather than voice-cloning via an audio ID-LoRA
  (contrast with the ''...-face-ref-audio-ref-...-id-lora-audio'' workflow, which
  clones a reference voice via an ID-LoRA instead of lip-syncing to a supplied track).
  2-pass: base pass uses a fixed 9-value manual sigma schedule (no scalar steps to
  flag), refine/upscale pass uses a fixed 4-value schedule; both CFGGuiders are pinned
  to 1.'
workflow: multi-ref-character-sheet-t2v-r2v-face-ref-custom-audio-best-face-id-lora.json
mode: [r2v, t2v]
output_node_title: "Video Combine \U0001F3A5\U0001F165\U0001F157\U0001F162"
flags:
  character_ref:
    node_title: CHARACTER SHEET
    param: image
    type: image
    required: true
    help: Face/character-sheet reference image driving visual identity (Face ID LoRA).
    node: '104'
  custom_audio:
    node_title: Load Audio
    param: audio
    type: str
    required: false
    default: ComfyUI_temp_jpkzj_00001.flac
    help: Custom audio track the character lip-syncs to -- must already exist in ComfyUI's
      input directory. Drives the mouth/performance directly from the waveform (SetLatentNoiseMask
      + LTXVAudioVAEEncode) rather than via a voice-cloning ID-LoRA. By default only
      the isolated vocals (Mel-Band RoFormer) are used ('USE VOCALS ONLY' switch,
      not exposed here as a flag -- boolean isn't a supported flag type).
    node: '2374'
  positive_prompt:
    node_title: Positive Prompt
    param: value
    type: str
    required: false
    default: "ref_t2v:  Caricature 3D animated movie. Extremely detailed and intricate.\
      \ A mafia boss, The Godfather, is seated at a table in a mahogyny gentlemans\
      \ club.  Close up view of The Godfather.\n\nThe scene is dim lit in a smoke\
      \ filled gentleman's club. \n\nThe Godfather talks with expressionless face\
      \ and gesticulates with his arms as he talks. He talks with perfect lip-sync\
      \ to the attached audio. "
    help: Should describe the character/scene and typically ends with an instruction
      like 'perfect lip-sync to the attached audio'.
    node: '102'
  negative_prompt:
    node_title: CLIP Text Encode (Prompt)
    param: text
    type: str
    required: false
    default: pc game, console game, video game, cartoon, childish, ugly, artifacts,
      low resolution, blurry, jagged edges
    node: '35'
  seed:
    node_title: 'RandomNoise #50'
    param: noise_seed
    type: int
    required: false
    default: 43
    node: '50'
  refine_seed:
    node_title: 'RandomNoise #131'
    param: noise_seed
    type: int
    required: false
    default: 42
    node: '131'
  width:
    node_title: WIDTH
    param: value
    type: int
    required: false
    default: 1280
    node: '2265'
  height:
    node_title: HEIGHT
    param: value
    type: int
    required: false
    default: 832
    node: '2266'
  length_seconds:
    node_title: LENGTH (in seconds)
    param: value
    type: int
    required: false
    default: 10
    node: '2263'
  fps:
    node_title: FPS
    param: value
    type: float
    required: false
    default: 24
    node: '2259'
  audio_trim_start:
    node_title: Trim Audio
    param: start_index
    type: int
    required: false
    default: 0
    help: Seconds into the custom audio clip to start reading from.
    node: '2378'
  audio_trim_duration:
    node_title: Trim Audio
    param: duration
    type: int
    required: false
    default: 40
    help: Seconds of the custom audio clip to use.
    node: '2378'
  faceid_lora_strength:
    node_title: Face ID LORA
    param: strength_model
    type: float
    required: false
    default: 1
    help: Strength of the Best_FaceID_v1.0 LoRA.
    node: '2245'
  filename_prefix:
    node_title: "Video Combine \U0001F3A5\U0001F165\U0001F157\U0001F162"
    param: filename_prefix
    type: str
    required: false
    default: LTX-2
    node: '2308'
