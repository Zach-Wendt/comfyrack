description: LTX-2.3 chained 5-scene music video generator -- takes 5 first-frame
  images + per-scene prompts/seeds/lengths + one shared audio track, generates each
  scene's clip in sequence (each scene's latent continues from the previous one for
  continuity), and combines all 5 into one final synced music video. Per-scene ownership
  of each prompt/seed/image/length primitive was confirmed by tracing its direct wire
  to the scene's own RandomNoise/length-calc/resize node (not just reachability, since
  scenes chain latents forward) -- high confidence but not GPU-verified. The graph
  also emits 4 unsaved intermediate 'Video Part N' clips (save_output=False, not the
  deliverable) and a second, untitled-suffix 'Video Combine' node whose image stream
  appears to duplicate FINAL VIDEO's; FINAL VIDEO was chosen as the output because
  it is the only save node with save_metadata=True and a purpose-named filename_prefix
  ('LTX-MusicVideo-Final').
workflow: music-video-creator-i2v-t2v-music-video-multi-scene-full-render.json
mode: [i2v, t2v]
output_node_title: FINAL VIDEO
flags:
