description: 'LTX-2.3 t2v/r2v workflow: the simplest of the face-ref family -- one
  face/character reference image + Best-Face-ID LoRA + a free-form text prompt, no
  audio reference and no second character-sheet-specific LoRA (contrast with ''...-t2v-r2v-character-sheet-best-face-id-lora'',
  which stacks a second, character-sheet-tuned Face-ID LoRA on top of this one). 2-pass:
  base pass uses a fixed 9-value manual sigma schedule (no scalar steps to flag),
  refine/upscale pass uses a fixed 4-value schedule; both CFGGuiders are pinned to
  1.'
workflow: multi-ref-character-sheet-t2v-r2v-face-ref-image-best-face-id-lora.json
mode: [r2v, t2v]
output_node_title: "Video Combine \U0001F3A5\U0001F165\U0001F157\U0001F162"
flags:
  character_ref:
    node_title: CHARACTER SHEET
    param: image
    type: image
    required: true
    help: Face/character-sheet reference image driving visual identity (Face ID LoRA).
    node: '104'
  positive_prompt:
    node_title: Positive Prompt
    param: value
    type: str
    required: false
    default: "ref_t2v:  Cinematic movie. A mid-age black man is walking inside a dystopian\
      \ futuristic gaming store with retro gaming machines. Dim lit with neon lights\
      \ and RGB lighs casting lights and shadows. \n\nThe black man is wearing a cyberpunk\
      \ futiristic outfit, he is semi android robotic with humanoid features. His\
      \ arms are robitc machine arms with wires and metal.\n\nHe talks with a deep\
      \ american voice and he says: \"Do electric sheep dream at night? And when its\
      \ GTA-6 coming out, its the year 2090 already....pfff\" "
    node: '102'
  negative_prompt:
    node_title: CLIP Text Encode (Prompt)
    param: text
    type: str
    required: false
    default: pc game, console game, video game, cartoon, childish, ugly, artifacts,
      low resolution, blurry, jagged edges
    node: '35'
  seed:
    node_title: 'RandomNoise #50'
    param: noise_seed
    type: int
    required: false
    default: 43
    node: '50'
  refine_seed:
    node_title: 'RandomNoise #131'
    param: noise_seed
    type: int
    required: false
    default: 42
    node: '131'
  width:
    node_title: WIDTH
    param: value
    type: int
    required: false
    default: 1280
    node: '2265'
  height:
    node_title: HEIGHT
    param: value
    type: int
    required: false
    default: 832
    node: '2266'
  length_seconds:
    node_title: LENGTH (in seconds)
    param: value
    type: int
    required: false
    default: 10
    node: '2263'
  fps:
    node_title: FPS
    param: value
    type: float
    required: false
    default: 24
    node: '2259'
  faceid_lora_strength:
    node_title: Face ID LORA
    param: strength_model
    type: float
    required: false
    default: 1
    help: Strength of the Best_FaceID_v1.0 LoRA.
    node: '2245'
  filename_prefix:
    node_title: "Video Combine \U0001F3A5\U0001F165\U0001F157\U0001F162"
    param: filename_prefix
    type: str
    required: false
    default: LTX-2
    node: '2308'
