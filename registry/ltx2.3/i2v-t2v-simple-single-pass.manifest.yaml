description: 'Stripped-down single-pass version of i2v-t2v-basic: no spatial-upscale/refine
  second pass, just one SamplerCustomAdvanced at the target resolution (960x544/24fps
  over 10s by default) -- faster and cheaper than the two-pass core workflow, at lower
  output resolution/detail. Positive prompt always runs through the internal LLM prompt-enhancer
  (no on/off toggle in this variant, unlike i2v-t2v-basic) using the input image as
  visual context. Despite the "t2v" in its name, this manifest only exposes the i2v
  path -- the JSON''s own "Text To Video (no image ref)" boolean toggle isn''t exposed
  as a flag (no bool flag type in this schema), so pure text-to-video mode needs a
  direct JSON edit; `image` is required here.

  '
workflow: i2v-t2v-simple-single-pass.json
mode: [i2v, t2v]
output_node_title: "Video Combine \U0001F3A5\U0001F165\U0001F157\U0001F162"
flags:
  positive_prompt:
    node_title: PROMPT
    param: value
    type: str
    required: false
    default: "Make this image come alive with fluid motion. \n\nA beautiful blonde\
      \ woman smiles towards the viewer.\n\nThen she talks and says with a soft female\
      \ british voice : \"Lets go making some great videos with LTX 2.3\".\n\n\nSteady\
      \ camera slowly panning in towards the main subject. \nThe scene is set to a\
      \ sunny windy day outside with the city in the background. Ambient low volume\
      \ city sound in the background. "
    help: Raw creative prompt -- always gets run through the internal LLM prompt-enhancer
      (using the input image as visual context) before becoming the actual positive
      conditioning text.
    node: '352'
  negative_prompt:
    node_title: 'CLIP Text Encode (Prompt) #110'
    param: text
    type: str
    required: false
    default: blurry, oversaturated, pixelated, low resolution, grainy, distorted,
      noise, compression artifacts, jpeg artifacts, glitches, watermark, text, logo,
      signature, copyright, subtitles, distorted sound, saturated sound, loud
    node: '110'
  image:
    node_title: Load Image
    param: image
    type: image
    required: true
    help: Server-side upload ref of the starting frame -- caller uploads via cc.upload()
      first.
    node: '167'
  seed:
    node_title: RandomNoise
    param: noise_seed
    type: int
    required: false
    default: 43
    node: '115'
  width:
    node_title: WIDTH
    param: value
    type: int
    required: false
    default: 960
    node: '292'
  height:
    node_title: HEIGHT
    param: value
    type: int
    required: false
    default: 544
    node: '293'
  length_seconds:
    node_title: LENGTH (in seconds)
    param: value
    type: int
    required: false
    default: 10
    node: '291'
  fps:
    node_title: FPS
    param: value
    type: float
    required: false
    default: 24
    node: '285'
