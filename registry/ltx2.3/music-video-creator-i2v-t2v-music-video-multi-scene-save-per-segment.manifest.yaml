description: 'LTX-2.3 chained 5-scene music video generator (save-per-segment variant)
  -- same 5-scene chained-latent pipeline as multi-scene-full-render (per-scene ownership
  of prompt/seed/image/length primitives traced and confirmed the same way), but each
  scene ALSO gets its own individually-saved SaveVideo node (4 ''Video Part N'' VHS_VideoCombine
  previews plus per-scene ''Save Video #<id>'' SaveVideo nodes inside each scene subgraph
  -- these write the intermediate per-segment clips to disk). The workflow still ends
  by combining all 5 scenes into one FINAL VIDEO, which is chosen as the output node
  here (per registration guidance: pick the final merged video when one exists). A
  second untitled-suffix ''Video Combine'' node (save_output=True) appears to duplicate
  FINAL VIDEO''s image stream and was not chosen.'
workflow: music-video-creator-i2v-t2v-music-video-multi-scene-save-per-segment.json
mode: [i2v, t2v]
output_node_title: FINAL VIDEO
flags:
  negative_prompt:
    node_title: 'CLIP Text Encode (Prompt) #1626'
    param: text
    type: str
    required: false
    default: text, subtitles, logo, still image, still video, no motion, static, frozen,
      blurry, low quality, distorted, bad anatomy, oversaturated, pixelated, low resolution,
      grainy, compression artifacts, jpeg artifacts, glitches, watermark, signature,
      copyright,  distortedsound, saturated sound, loud sound , deformed facial features,
      asymmetrical face, missing facial features, extra limbs, disfigured hands, blurry
      teeth, disfigured teeth
    help: Single negative prompt shared by all 5 scenes.
    node: '1626'
