description: 'LTX-2.3 i2v/t2v "long video" experimental pipeline: one starting image
  is animated with a base pass, then extended via a ComfyUI for-loop group ("EXTEND
  GROUPS" = 5 sub-chunks per variant, each ~97 motion-frame overlap) to reach a long
  custom-audio-driven runtime. The graph actually contains FIVE independent continuation
  variants of the SAME base pass -- five separate {prompt, seed, extend-loop} groups
  (loop ids 821/2856/2994/3132/3270), each producing its own "FINAL VIDEO #NNNN" (the
  loop''s accumulated video-so-far) plus a "PARTIAL VIDEO FROM LOOP #..." (that loop''s
  own newly-generated segment only, undecorated). This manifest exposes the FIRST
  variant''s output, "FINAL VIDEO #312" (prompt PROMPT #825 / seed SEED #1138, default
  seed 100) -- the other four (FINAL VIDEO #2853/#2991/#3129/#3267, each with its
  own PROMPT/SEED pair and its own PARTIAL VIDEO save) are equally valid alternate-seed
  long-video outputs not exposed here; edit the JSON directly to run one of those
  instead. The 5-loop extend mechanism itself (overlap math, motion-frame stitching,
  per-iteration ColorMatch) is left as fixed structural complexity -- not flagged.

  '
workflow: long-video-experimental-i2v-t2v-long-video-custom-audio.json
mode: [i2v, t2v]
output_node_title: 'FINAL VIDEO #312'
flags:
  positive_prompt:
    node_title: 'PROMPT #825'
    param: value
    type: str
    required: false
    default: "Make this image come alive with fluid motion. \n\nA beautiful female\
      \ with guitar is singing and playing guitar, sitting down at a chair.  She sings\
      \ with perfect lip-sync to the attached audio. \n\nShe is singing a beautiful\
      \ slow song with passionate expression at her face.\n\nCinematic engaging video\
      \ from a cosy cafe lounge venue."
    help: 'Feeds the first variant''s continuation prompt (loop 821, chained to FINAL
      VIDEO #312) via CLIP Text Encode #821:431.'
    node: '825'
  negative_prompt:
    node_title: 'CLIP Text Encode (Prompt) #821:435'
    param: text
    type: str
    required: false
    default: text, subtitles, logo, still image, still video, no motion, static, frozen,
      blurry, low quality, distorted, bad anatomy, oversaturated, pixelated, low resolution,
      grainy, compression artifacts, jpeg artifacts, glitches, watermark, signature,
      copyright,  distortedsound, saturated sound, loud sound
    node: 821:435
  seed:
    node_title: 'SEED #1138'
    param: value
    type: int
    required: false
    default: 100
    help: 'Noise seed for the first variant''s extend loop (821) -> FINAL VIDEO #312.'
    node: '1138'
  image1:
    node_title: Load Image
    param: image
    type: image
    required: true
    help: Starting frame animated by the shared base pass that all 5 continuation
      variants extend from.
    node: '1784'
  audio:
    node_title: Load Audio
    param: audio
    type: str
    required: false
    default: Hallelujah - Lucy Thomas - (Official Music Video).mp3
    help: Custom audio track (lip-sync source). Must already exist in ComfyUI's input
      directory -- no upload path for audio in this CLI.
    node: '2124'
  length_seconds:
    node_title: LENGTH (in seconds)
    param: value
    type: int
    required: false
    default: 10
    help: Target length in seconds per extend segment, feeds the frame-count math
      shared by all 5 loops.
    node: '2120'
  fps:
    node_title: FPS
    param: value
    type: float
    required: false
    default: 24
    node: '2123'
  width:
    node_title: WIDTH
    param: value
    type: int
    required: false
    default: 960
    node: '2137'
  height:
    node_title: HEIGHT
    param: value
    type: int
    required: false
    default: 544
    node: '2138'
