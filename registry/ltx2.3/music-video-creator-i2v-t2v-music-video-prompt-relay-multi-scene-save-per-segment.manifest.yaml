    param: local_prompts
    type: str
    required: false
    default: "She is walking through a dystopian abandoned hall, tracking camera as\
      \ she walks towards the viewer. The camera pulls away slowly keeping same distance\
      \ to the woman. \n\nShe sings with expressive face emotion and body gesticulation\
      \ as she sings the words of the song. She sings with perfect lip-sync to the\
      \ attached audio. \n\nRock music video. The woman has attitude and expressive\
      \ body language. Cinematic, volumetric lights, shadow play. \n\n | Scene cut\
      \ / scene change.\n\nShe is standing on top of a stone block inside the hallway.\
      \ Camera rapidly pulls in towards the woman, dolly zoom. \n\nShe sings with\
      \ expressive face emotion and body gesticulation as she sings the words of the\
      \ song. She sings with perfect lip-sync to the attached audio. \n\nRock music\
      \ video. The woman has attitude and expressive body language. Cinematic, volumetric\
      \ lights, shadow play. "
    help: 'Scene 1 human-readable action prompt (this node''s own free-text field).
      NOTE: this Prompt-Relay node ALSO carries a `timeline_data` JSON blob with the
      same prompt text plus segment-boundary metadata (segment_lengths) -- changing
      this flag does NOT update timeline_data in sync, so a mismatched pair may confuse
      the relay''s timing. For full control edit the workflow JSON directly.'
    node: '6692'
  scene1_max_frames:
