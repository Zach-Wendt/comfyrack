description: 'LTX-2.3 chained 5-scene music video generator, ''prompt relay'' variant
  -- like multi-scene-save-per-segment (same chained-latent 5-scene pipeline, per-scene
  SaveVideo + final merge), but scene text conditioning is produced by a custom PromptRelayEncodeTimeline
  node per scene instead of a plain CLIPTextEncode: each scene''s node holds a `global_prompt`
  (identical boilerplate across all 5, not flagged), a human-editable `local_prompts`
  string (flagged as sceneN_prompt), a `max_frames` time budget (flagged as sceneN_max_frames),
  and a `timeline_data` JSON blob + `segment_lengths` string that encode the same
  per-scene action text split into timed sub-segments -- these two structural fields
  are NOT flagged because they must stay hand-synced with local_prompts/max_frames
  (the manifest system can only patch one scalar field at a time, not keep a JSON
  blob and its flat-text twin consistent). Negative conditioning is auto-zeroed (ConditioningZeroOut),
  not a literal negative prompt, so no negative_prompt flag exists. Output is FINAL
  VIDEO (the merged 5-scene deliverable), same choice as the sibling multi-scene workflows;
  per-scene ''Save Video''/''Video From This Group'' nodes (save_output=False or intermediate)
  write the individual segment files but are not the primary deliverable.'
workflow: music-video-creator-i2v-t2v-music-video-prompt-relay-multi-scene-save-per-segment.json
mode: [i2v, t2v]
output_node_title: FINAL VIDEO
