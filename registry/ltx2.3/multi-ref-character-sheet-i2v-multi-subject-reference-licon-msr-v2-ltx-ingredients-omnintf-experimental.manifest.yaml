description: 'EXPERIMENTAL variant of the Licon-MSR-V2 multi-subject-reference i2v/t2v
  workflow (see the plain ''...-licon-msr-v2-lora'' workflow for the non-experimental
  version): stacks THREE LoRAs -- Licon-MSR-V2 (multi-subject-reference IC-LoRA),
  an ''ingredients'' IC-LoRA (ltx-2.3-22b-ic-lora-ingredients-0.9), and OmniNFT-RL-Lora
  -- on top of each other, feeding the same 2 reference images + 1 background/scene
  image + PromptRelayEncode global/local scene-script prompting structure as the plain
  V2 workflow. Marked ''experimental'' by the source workflow''s own filename; not
  validated here against the plain V2 workflow''s output quality -- treat the 3-LoRA
  stack as unproven until a real comparison render is done.'
workflow: multi-ref-character-sheet-i2v-multi-subject-reference-licon-msr-v2-ltx-ingredients-omnintf-experimental.json
mode: [i2v]
output_node_title: "Video Combine \U0001F3A5\U0001F165\U0001F157\U0001F162"
flags:
  ref_image_1:
    node_title: Ref Image 1
    param: image
    type: image
    required: true
    help: First multi-subject reference image (e.g. a character).
    node: '1273'
  ref_image_2:
    node_title: Ref Image 2
    param: image
    type: image
    required: true
    help: Second multi-subject reference image (e.g. an object/prop).
    node: '1267'
  background_scene:
    node_title: Background / Scene
    param: image
    type: image
    required: true
    help: Background/scene plate the referenced subjects get placed into.
    node: '1275'
  global_prompt:
    node_title: Prompt Relay Encode
    param: global_prompt
    type: str
    required: false
    default: "Figure 1:  A bald hitman for hire with a gold neckless and a light green\
      \ Addidas training suit. \nFigure 2: A posh woman with black coat and black\
      \ hat, long wavy silver white hair\nFigure 3:  A street at night wintertime\
      \ with a tram passing by\n"
    help: 'Per-figure identity descriptions (Figure 1/2/3: ...) matching the reference
      images.'
    node: '180'
  local_prompts:
    node_title: Prompt Relay Encode
    param: local_prompts
    type: str
    required: false
    default: "The scene starts with a panoramic view of a city street at night. Its\
      \ winter, its snowing and a red tram is driving by.\n\nCamera changes direction\
      \ and Male A is in frame. He talks with a heavy British Liverpool accent and\
      \ says: \"So lady, what was it you had in mind. Dragging me out in a cold winter\
      \ night\". \n\nThe camera orbits 90 degress to the left, and Woman A is in frame.\
      \ She talks with a soft British accent and says: \"I just wanted to give you\
      \ a heads up. There is a new Multi Subject Reference lora in town\".\n\n\nThe\
      \ scene has a mysterious foreboding ominous atmosphere\n\n"
    help: Scene script/action/dialogue describing what happens in the video.
    node: '180'
  negative_prompt:
    node_title: CLIP Text Encode (Prompt)
    param: text
    type: str
    required: false
    default: 'subtitles, watermark, worst quality, blurry, jittery, distorted, inconsistent
      appearance

      '
    node: '185'
  seed:
    node_title: 'RandomNoise #15'
    param: noise_seed
    type: int
    required: false
    default: 725194603285255
    node: '15'
  refine_seed:
    node_title: 'RandomNoise #1342'
    param: noise_seed
    type: int
    required: false
    default: 43
    node: '1342'
  width:
    node_title: WIDTH
    param: value
    type: int
    required: false
    default: 1536
    node: '203'
  height:
    node_title: HEIGHT
    param: value
    type: int
    required: false
    default: 832
    node: '204'
  length_seconds:
    node_title: LENGTH (in seconds)
    param: value
    type: int
    required: false
    default: 15
    node: '201'
  fps:
    node_title: FPS
    param: value
    type: float
    required: false
    default: 24
    node: '197'
  steps:
    node_title: BasicScheduler ( for more steps)
    param: steps
    type: int
    required: false
    default: 10
    help: Base-pass step count. The refine/upscale pass uses a fixed 4-value manual
      sigma schedule instead of a scalar steps count, not exposed as a flag.
    node: '1366'
  licon_msr_lora_strength:
    node_title: "\U0001F15B\U0001F163\U0001F167 IC-LoRA Loader Model Only #10"
    param: strength_model
    type: float
    required: false
    default: 0.5
    help: Strength of the Licon-MSR-V2 multi-subject-reference IC-LoRA (first of 3
      stacked LoRAs).
    node: '10'
  ingredients_lora_strength:
    node_title: "\U0001F15B\U0001F163\U0001F167 IC-LoRA Loader Model Only #189"
    param: strength_model
    type: float
    required: false
    default: 1
    help: Strength of the 'ltx-2.3-22b-ic-lora-ingredients-0.9' IC-LoRA (second of
      3 stacked LoRAs, the 'ingredients' technique this workflow variant is named
      for).
    node: '189'
  omninft_lora_strength:
    node_title: Load LoRA
    param: strength_model
    type: float
    required: false
    default: 0.6
    help: Strength of the LTX-2.3-OmniNFT-RL-Lora (third of 3 stacked LoRAs, the 'omnintf'
      technique this workflow variant is named for).
    node: '193'
  filename_prefix:
    node_title: "Video Combine \U0001F3A5\U0001F165\U0001F157\U0001F162"
    param: filename_prefix
    type: str
    required: false
    default: LTX
    node: '1343'
