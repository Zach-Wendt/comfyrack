description: 'Same two-pass core image-to-video pipeline as i2v-t2v-basic, but sourcing
  the transformer + text encoder from a single full checkpoint (CheckpointLoaderSimple,
  ltx-2.3-22b-dev-fp8) instead of the split UNETLoader/DualCLIPLoader/GGUF loaders
  -- for setups where only the merged checkpoint file is available. A "ltx-2.3-22b-distilled-lora"
  is layered on top at partial strength to approximate the distilled model''s fast/few-step
  behavior on top of the dev checkpoint; that LoRA strength is exposed below since
  it''s the whole point of this variant. Despite the "t2v" in its name, this manifest
  only exposes the i2v path -- the JSON''s own "Text To Video (no image ref)" boolean
  toggle isn''t exposed as a flag (no bool flag type in this schema), so pure text-to-video
  mode needs a direct JSON edit; `image` is required here.

  '
workflow: i2v-t2v-basic-for-checkpoint-models.json
mode: [i2v, t2v]
output_node_title: "Video Combine \U0001F3A5\U0001F165\U0001F157\U0001F162"
flags:
  positive_prompt:
    node_title: PROMPT
    param: value
    type: str
    required: false
    default: "Make this image come alive with fluid motion. \n"
    help: Raw creative prompt -- gets run through the internal LLM prompt-enhancer
      (using the input image as visual context, off by default in this variant) before
      becoming the actual positive conditioning text.
    node: '352'
  negative_prompt:
    node_title: 'CLIP Text Encode (Prompt) #110'
    param: text
    type: str
    required: false
    default: blurry, oversaturated, pixelated, low resolution, grainy, distorted,
      noise, compression artifacts, jpeg artifacts, glitches, watermark, text, logo,
      signature, copyright, subtitles, distorted sound, saturated sound, loud
    node: '110'
  image:
    node_title: Load Image
    param: image
    type: image
    required: true
    help: Server-side upload ref of the starting frame -- caller uploads via cc.upload()
      first.
    node: '167'
  distilled_lora_strength:
    node_title: Load LoRA
    param: strength_model
    type: float
    required: false
    default: 0.5
    help: Strength of the distilled-behavior LoRA layered on the full dev checkpoint
      -- this is the mechanism that makes the checkpoint-loader path usable at low
      step counts.
    node: '362'
  seed:
    node_title: 'RandomNoise #115'
    param: noise_seed
    type: int
    required: false
    default: 43
    help: Seed for the base (half-resolution) first pass.
    node: '115'
  seed_refine:
    node_title: 'RandomNoise #114'
    param: noise_seed
    type: int
    required: false
    default: 42
    help: Seed for the second (spatial-upscale + refine) pass.
    node: '114'
  width:
    node_title: WIDTH
    param: value
    type: int
    required: false
    default: 1280
    node: '292'
  height:
    node_title: HEIGHT
    param: value
    type: int
    required: false
    default: 736
    node: '293'
  length_seconds:
    node_title: LENGTH (in seconds)
    param: value
    type: int
    required: false
    default: 10
    node: '291'
  fps:
    node_title: FPS
    param: value
    type: float
    required: false
    default: 24
    node: '285'
