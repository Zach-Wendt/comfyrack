description: 'Concatenates 5 already-rendered video clips (frame-batches them in order,
  then re-encodes as one H264 MP4 at the first clip''s frame rate) into a single merged
  music-video file. NOTE: despite the workflow''s filename, this specific exported
  graph contains no interpolation (RIFE/etc) or upscale nodes -- it is a straight
  batch-and-combine of the 5 loaded clips; treat the ''interpolate/upscale'' claim
  in the name as aspirational/not present in this API export.'
workflow: music-video-creator-helper-workflows-video-merge-combine-with-interpolate-upscale.json
