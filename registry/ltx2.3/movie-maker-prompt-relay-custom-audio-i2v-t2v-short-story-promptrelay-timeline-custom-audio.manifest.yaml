      Asian cinematic noir style,inspired by Wong Kar-Wai and Blade Runner 2049, photographed
      with a Samyang AF 35mm f/1.4 RF lens, rich ambient mood,stylized color palette
      of crimson,cyan,and deep charcoal
    node: '709'
