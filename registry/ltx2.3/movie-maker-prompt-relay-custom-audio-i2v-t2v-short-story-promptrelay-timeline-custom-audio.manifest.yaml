description: 'LTX-2.3 i2v/t2v "Movie Maker" short-story pipeline with 4 DISTINCT reference/keyframe
  images (one per scene, a lip-sync music-video sequence) plus a CUSTOM AUDIO track
  (trimmed to start at a chosen offset via "START AUDIO FROM"), driven by a plain
  "Prompt Relay Encode" node (NOT the Timeline variant, despite "timeline" in this
  workflow''s filename) whose local_prompts/ segment_lengths are built by concatenating
  4 editable Segment Prompt #NNN + Length Segment (seconds) #NNN literal pairs --
  this manifest flags each segment''s image/prompt/length node directly rather than
  the concatenated relay inputs, keeping each scene independently editable. Renders
  at 1920x1080 using the "dev" (non-distilled) UNET checkpoint plus a separate "Load
  LoRA" node re-applying the LTX-2.3 distilled-dynamic acceleration LoRA on top (strength
  0.6, fixed -- this LoRA is the same generic acceleration LoRA used across most movie-maker
  workflows in this registry, not this workflow''s distinguishing technique, so its
  strength is left as a literal per registry convention). The "Negative Prompt"/"CLIP
  Text Encode (Prompt)" CLIPTextEncode nodes in this JSON are dead ends (PromptRelayEncode
  has no negative-text input of its own -- its negative conditioning is auto-generated
  then zeroed via ConditioningZeroOut) -- traced and confirmed unreferenced, so no
  negative_prompt flag exists for this workflow. "USE VOCALS ONLY" (vocal isolation
  via Mel-Band RoFormer vs. the raw trimmed audio) is a boolean switch fixed true,
  not flaggable. Base pass -> LTXVLatentUpsampler spatial-upscale second pass -> single
  VHS_VideoCombine save (only one save node exists, so output selection is unambiguous).

  '
workflow: movie-maker-prompt-relay-custom-audio-i2v-t2v-short-story-promptrelay-timeline-custom-audio.json
mode: [i2v, t2v]
output_node_title: "Video Combine \U0001F3A5\U0001F165\U0001F157\U0001F162"
