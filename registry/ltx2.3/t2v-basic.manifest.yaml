description: LTX-2.3 basic text-to-video generator -- no reference image, pure text
  prompt (auto-enhanced by a local Generate-LTX2-Prompt LLM node) with LTX's own generated
  audio, two chained sampling passes (base + latent-upscale refinement), saved as
  one MP4. Only one save node exists (Video Combine). The JSON also contains a disconnected/bypassed
  alternate GGUF unet+clip loader pair (dead-end, not on the active execution path)
  -- not flagged.
workflow: t2v-basic.json
mode: [t2v]
output_node_title: "Video Combine \U0001F3A5\U0001F165\U0001F157\U0001F162"
flags:
  prompt:
    node_title: PROMPT
    param: value
    type: str
    required: false
    default: "A woman at a chair and looks towards the camera.\n\n0-4 seconds : She\
      \ takes off her hat.\n\n4-8 seconds:\nShe talks with a soft British accent and\
      \ says \"So due to recent changes, here is a workflow with new model loaders\"\
      .\n\n10-10 seconds: She smiles and lift one hand to make a peace sign with her\
      \ fingers.\n\nStyle: \nWes Anderson style, rigid, centered symmetry, pastel\
      \ color palette, whimsical, nostalgic aesthetic."
    help: Scene/action/dialogue description -- passed through the local Generate LTX2
      Prompt (LLM) node for enhancement before encoding.
    node: '352'
  negative_prompt:
    node_title: 'CLIP Text Encode (Prompt) #110'
    param: text
    type: str
    required: false
    default: blurry, oversaturated, pixelated, low resolution, grainy, distorted,
      noise, compression artifacts, jpeg artifacts, glitches, watermark, text, logo,
      signature, copyright, subtitles, distorted sound, saturated sound, loud
    node: '110'
  seed_pass1:
    node_title: 'RandomNoise #114'
    param: noise_seed
    type: int
    required: false
    default: 420
    node: '114'
  seed_pass2:
    node_title: 'RandomNoise #115'
    param: noise_seed
    type: int
    required: false
    default: 43
    node: '115'
  width:
    node_title: WIDTH
    param: value
    type: int
    required: false
    default: 1280
    node: '292'
  height:
    node_title: HEIGHT
    param: value
    type: int
    required: false
    default: 736
    node: '293'
  length_seconds:
    node_title: LENGTH (in seconds)
    param: value
    type: int
    required: false
    default: 10
    node: '291'
  fps:
    node_title: FPS
    param: value
    type: float
    required: false
    default: 24
    node: '285'
