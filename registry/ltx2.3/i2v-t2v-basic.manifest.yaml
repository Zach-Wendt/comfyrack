description: 'Core LTX-2.3 image-to-video (or text-to-video if no image is given)
  workflow using the distilled fp8 transformer (UNETLoader) + a GGUF fallback loader
  (present but unwired unless the fp8 checkpoint is swapped out -- not exposed here,
  structural). Two-pass: a base pass at half the target resolution, then a 2x latent-upscale
  + refine pass at full resolution, decoded through a tiled VAE. Positive prompt runs
  through an internal LLM prompt-enhancer (Gemma) that expands the raw prompt using
  the input image as visual context before becoming the actual conditioning text.
  This is the default/most-general LTX-2.3 workflow in the registry. Despite the "t2v"
  in its name, this manifest only exposes the i2v path -- the JSON''s own "Text To
  Video (no image ref)" boolean toggle isn''t exposed as a flag (no bool flag type
  in this schema), so pure text-to-video mode needs a direct JSON edit; `image` is
  required here.

  '
workflow: i2v-t2v-basic.json
mode: [i2v, t2v]
output_node_title: "Video Combine \U0001F3A5\U0001F165\U0001F157\U0001F162"
flags:
  positive_prompt:
    node_title: PROMPT
    param: value
    type: str
    required: false
    default: "Make this image come alive with fluid motion. \n\nA beautiful blonde\
      \ woman smiles towards the viewer.\n\nThen she talks and says with a soft female\
      \ british voice : \"Lets go making some great videos with LTX 2.3\".\n\n\nSteady\
      \ camera slowly panning in towards the main subject. \nThe scene is set to a\
      \ cosy cafe with dimmed lights. "
    help: Raw creative prompt -- gets run through the internal LLM prompt-enhancer
      (using the input image as visual context) before becoming the actual positive
      conditioning text.
    node: '352'
  negative_prompt:
    node_title: 'CLIP Text Encode (Prompt) #110'
    param: text
    type: str
    required: false
    default: blurry, oversaturated, pixelated, low resolution, grainy, distorted,
      noise, compression artifacts, jpeg artifacts, glitches, watermark, text, logo,
      signature, copyright, subtitles, distorted sound, saturated sound, loud
    node: '110'
  image:
    node_title: Load Image
    param: image
    type: image
    required: true
    help: 'Server-side upload ref of the starting frame -- caller uploads via cc.upload()
      first. This flag interface is i2v-only: the JSON''s ''Text To Video (no image
      ref)'' boolean toggle (default False/off) isn''t exposed as a flag, so pure
      text-to-video mode requires editing that node directly.'
    node: '167'
  seed:
    node_title: 'RandomNoise #115'
    param: noise_seed
    type: int
    required: false
    default: 43
    help: Seed for the base (half-resolution) first pass.
    node: '115'
  seed_refine:
    node_title: 'RandomNoise #114'
    param: noise_seed
    type: int
    required: false
    default: 42
    help: Seed for the second (spatial-upscale + refine) pass.
    node: '114'
  width:
    node_title: WIDTH
    param: value
    type: int
    required: false
    default: 1280
    node: '292'
  height:
    node_title: HEIGHT
    param: value
    type: int
    required: false
    default: 736
    node: '293'
  length_seconds:
    node_title: LENGTH (in seconds)
    param: value
    type: int
    required: false
    default: 10
    node: '291'
  fps:
    node_title: FPS
    param: value
    type: float
    required: false
    default: 24
    node: '285'
