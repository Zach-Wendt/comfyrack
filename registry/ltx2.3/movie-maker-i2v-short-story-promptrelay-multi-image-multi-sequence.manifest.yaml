description: 'LTX-2.3 i2v "Movie Maker" short-story pipeline with 4 DISTINCT reference/keyframe
  images (one per scene, each resized independently and fed into that scene''s segment),
  driven by a "Prompt Relay Encode" node whose local_prompts/segment_lengths are built
  by concatenating 4 editable Segment Prompt #NNN + Length Segment (seconds) #NNN
  literal pairs -- this manifest flags each segment''s image/prompt/length node directly
  rather than the concatenated relay inputs, keeping each of the 4 scenes independently
  editable. Base pass -> LTXVLatentUpsampler spatial-upscale second pass -> single
  VHS_VideoCombine save (only one save node exists, so output selection is unambiguous).

  '
workflow: movie-maker-i2v-short-story-promptrelay-multi-image-multi-sequence.json
mode: [i2v]
output_node_title: "Video Combine \U0001F3A5\U0001F165\U0001F157\U0001F162"
flags:
  master_prompt:
    node_title: MASTER PROMPT (for the whole video)
    param: value
    type: str
    required: false
    default: mysterious  Jakarta at night, dramatic shadows and rim light,hyperrealistic,
      Asian cinematic noir style,inspired by Wong Kar-Wai and Blade Runner 2049, photographed
      with a Samyang AF 35mm f/1.4 RF lens, rich ambient mood,stylized color palette
      of crimson,cyan,and deep charcoal
    node: '709'
  image1:
    node_title: 'Load Image #820'
    param: image
    type: image
    required: true
    help: Reference/keyframe image for scene 1.
    node: '820'
  scene1_prompt:
    node_title: 'Segment Prompt #824'
    param: value
    type: str
    required: false
    default: "The woman, called Elsa, is walking down the street. Tracking camera.\
      \ She talks with an asian-american accents, and she says:  \"I hope I can find\
      \ him. The prompter better change the scene\" \n\nIts raining.\n\nAt the end,\
      \ scene cut to a new scene. "
    node: '824'
  scene1_seconds:
    node_title: 'Length Segment  (seconds) #625'
    param: value
    type: int
    required: false
    default: 8
    node: '625'
  image2:
    node_title: 'Load Image #846'
    param: image
    type: image
    required: true
    help: Reference/keyframe image for scene 2.
    node: '846'
  scene2_prompt:
    node_title: 'Segment Prompt #848'
    param: value
    type: str
    required: false
    default: "A man called Tom, is waiting, leaning up against the wall. He talks\
      \ with a rusty deep american accent, and he says:  \"wonder where she is.  She\
      \ said she would be here after 16 seconds\". \n\nIts raining.\n\nAt the end,\
      \ scene cut to a new scene. "
    node: '848'
  scene2_seconds:
    node_title: 'Length Segment  (seconds) #849'
    param: value
    type: int
    required: false
    default: 8
    node: '849'
  image3:
    node_title: 'Load Image #859'
    param: image
    type: image
    required: true
    help: Reference/keyframe image for scene 3.
    node: '859'
  scene3_prompt:
    node_title: 'Segment Prompt #861'
    param: value
    type: str
    required: false
    default: "Tom and Elsa have met up. The man says : \"of all the towns in the world,\
      \ you had to walk into mine\".  \n\nThe woman says: \" lets go find a bar\"\
      . \n\nIts raining.\n\nAt the end, scene cut to a new scene. "
    node: '861'
  scene3_seconds:
    node_title: 'Length Segment (seconds) #862'
    param: value
    type: int
    required: false
    default: 8
    node: '862'
  image4:
    node_title: 'Load Image #872'
    param: image
    type: image
    required: true
    help: Reference/keyframe image for scene 4.
    node: '872'
  scene4_prompt:
    node_title: 'Segment Prompt #874'
    param: value
    type: str
    required: false
    default: "Tom and Elsa are seated at a window at a dim lit bar. Elsa talks, and\
      \ she says : \"So what do you know about this Prompt Relay?\" \n\nThe man nods\
      \ his head, and he says : \"I will share the secret another day...\" \n\nThe\
      \ camrea pulls out, and shows more of the scene...   and at the very end text\
      \ \"THE END\" shows in bold font across the screen"
    node: '874'
  scene4_seconds:
    node_title: 'Length Segment (seconds) #875'
    param: value
    type: int
    required: false
    default: 8
    node: '875'
  negative_prompt:
    node_title: Negative Prompt
    param: text
    type: str
    required: false
    default: blurry, oversaturated, pixelated, low resolution, grainy, distorted,
      noise, compression artifacts, jpeg artifacts, glitches, watermark, text, logo,
      signature, copyright, subtitles, distorted sound, saturated sound, loud
    node: '777'
  seed_pass1:
    node_title: 'RandomNoise #773'
    param: noise_seed
    type: int
    required: false
    default: 43
    help: Seed for the base (first) sampling pass.
    node: '773'
  seed_pass2:
    node_title: 'RandomNoise #774'
    param: noise_seed
    type: int
    required: false
    default: 42
    help: Seed for the spatial-upsampler (second) sampling pass.
    node: '774'
  width:
    node_title: WIDTH
    param: value
    type: int
    required: false
    default: 1280
    node: '699'
  height:
    node_title: HEIGHT
    param: value
    type: int
    required: false
    default: 720
    node: '701'
  fps:
    node_title: FPS
    param: value
    type: float
    required: false
    default: 24
    node: '697'
