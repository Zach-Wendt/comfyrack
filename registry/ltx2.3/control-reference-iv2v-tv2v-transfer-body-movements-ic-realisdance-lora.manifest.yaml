description: 'LTX-2.3 control/reference i2v: transfers the body-movement performance
  from a driving "Control Video" onto a single reference image, via the RealisDance
  IC-LoRA + pose extraction (SDPose by default, DWPose available via an in-JSON switch
  not exposed here), 2-pass sample+upscale, then muxes to an MP4. Also saves a pose-preview
  clip of the extracted control-video poses via node 5120 ("Pose" prefix, save_output
  false) -- not exposed by this manifest, that''s a debug/intermediate artifact, not
  the deliverable. Audio: by default the output audio track comes from the control
  video''s own audio (an in-JSON switch chain gated by "USE AUDIO INPUT?", default
  true), not from the custom_audio_file flag below -- that file only takes effect
  if the nested "From custom audio file?" switch (node 5361:5274) is also flipped
  to true directly in the JSON.

  '
workflow: control-reference-iv2v-tv2v-transfer-body-movements-ic-realisdance-lora.json
mode: [v2v]
output_node_title: "Video Combine \U0001F3A5\U0001F165\U0001F157\U0001F162 #5208"
flags:
  positive_prompt:
    node_title: Prompt
    param: value
    type: str
    default: "highly detailed. Make this image come alive with fluid motion. \n\n\
      The man is dancing in perfect sync to the music with expressive body language\
      \ and fast motion. "
    help: Raw user prompt; may be rewritten by the in-graph LLM prompt enhancer before
      reaching CLIP (see 'ENABLE PROMPT ENHANCER' node 5201, default off here -- not
      exposed).
    node: '5242'
  negative_prompt:
    node_title: CLIP Text Encode (Negative Prompt)
    param: text
    type: str
    default: low contrast, washed out, text, subtitles, logo, still image, still video,
      blurry, low quality, distorted, bad anatomy, oversaturated, pixelated, low resolution,
      grainy, compression artifacts, jpeg artifacts, glitches, watermark, signature,
      copyright,  distortedsound, saturated sound, loud sound , deformed facial features,
      asymmetrical face, missing facial features, extra limbs, disfigured hands, blurry
      teeth, disfigured teeth
    node: '2612'
  image:
    node_title: Load Image
    param: image
    type: image
    required: true
    help: Reference subject image that the control video's body movements are transferred
      onto.
    node: '2004'
  control_video:
    node_title: Control Video
    param: video
    type: str
    default: m2-res_1890p.mp4
    help: Driving video whose body movements/poses are extracted and transferred.
      Must already exist in ComfyUI's input directory -- no upload path exists for
      video yet in this CLI.
    node: '5192'
  custom_audio_file:
    node_title: Custom audio file (optional)
    param: audio
    type: str
    default: (Verse).mp3
    help: Must already exist in ComfyUI's input directory. Only used if the nested
      audio-source switch is also changed in the JSON -- see description; by default
      the control video's own audio is used instead.
    node: '5263'
  seed_pass1:
    node_title: 'RandomNoise #4832'
    param: noise_seed
    type: int
    default: 42
    help: Seed for the base pass.
    node: '4832'
  seed_pass2:
    node_title: 'RandomNoise #5068'
    param: noise_seed
    type: int
    default: 43
    help: Seed for the upscale/refine pass.
    node: '5068'
  pose_strength:
    node_title: POSE STRENGTH
    param: value
    type: float
    default: 0.7
    help: Strength of the IC-LoRA video-guide conditioning (LTXAddVideoICLoRAGuide)
      -- how strongly the extracted pose drives the output motion.
    node: '5299'
  width:
    node_title: WIDTH
    param: value
    type: int
    default: 736
    node: '5206'
  height:
    node_title: HEIGHT
    param: value
    type: int
    default: 1280
    node: '5207'
  length_seconds:
    node_title: LENGTH (in seconds)
    param: value
    type: int
    default: 10
    node: '5205'
  fps:
    node_title: FPS
    param: value
    type: float
    default: 24
    node: '5199'
