description: 'Same first+last-frame-guided image-to-video (FLF2V) pipeline as first-last-frame-flf2v-first-last-frame,
  with a "ltx2.3-transition.safetensors" LoRA loaded at strength 1 on the Power Lora
  Loader (rgthree) node -- this LoRA is the whole point of this variant (smoother/more
  coherent interpolation between two very different frames) and is baked in at a fixed
  strength, not exposed as a flag here: Power Lora Loader stores each slot as a single
  {on, lora, strength} dict under one input key (e.g. "lora_1"), which this registry''s
  set_node_param() can''t patch a sub-field of without clobbering the whole slot (same
  limitation noted in the wan/txt2vid manifest). Also carries
  a second internal "TRANSITION PROMPT" instruction template (feeds the LLM prompt-enhancer,
  not user-facing) alongside the default one.

  '
workflow: first-last-frame-flf2v-first-last-frame-transition-lora.json
mode: [r2v]
output_node_title: "Video Combine \U0001F3A5\U0001F165\U0001F157\U0001F162"
flags:
  positive_prompt:
    node_title: PROMPT
    param: value
    type: str
    required: false
    default: "Make this image come alive with cinematic motion, smooth animation.\
      \ \n\nA foggy night in in 1700's Amsterdam. The fog is thick and swirling, illuminating\
      \ by streetlights. we see a bridge over a canal, cobblestone streets, canal\
      \ buildings lining the canal The vibe is uneasy, moody, slightly dangerous.\n\
      \nThe camera crane down high angle to a low angle ending with a close up of\
      \ a vampire's hand with leather gloves on holding a walking cane.  Single continuous\
      \ camera shot "
    help: Raw creative prompt -- gets run through the internal LLM prompt-enhancer
      (using the first frame as visual context) before becoming the actual positive
      conditioning text.
    node: '2103'
  negative_prompt:
    node_title: 'CLIP Text Encode (Prompt) #11'
    param: text
    type: str
    required: false
    default: blurry, oversaturated, pixelated, low resolution, grainy, distorted,
      noise, compression artifacts, jpeg artifacts, glitches, watermark, text, logo,
      signature, copyright, subtitles, distorted sound, saturated sound, loud
    node: '11'
  first_frame:
    node_title: FIRST FRAME
    param: image
    type: image
    required: true
    help: Server-side upload ref of the video's opening frame -- caller uploads via
      cc.upload() first.
    node: '45'
  last_frame:
    node_title: LAST FRAME
    param: image
    type: image
    required: true
    help: Server-side upload ref of the video's closing frame -- caller uploads via
      cc.upload() first.
    node: '47'
  first_frame_strength:
    node_title: FIRST FRAME STRENGTH
    param: value
    type: float
    required: false
    default: 0.5
    help: How strongly the first frame image conditions the start of the generated
      video.
    node: '2110'
  last_frame_strength:
    node_title: LAST FRAME STRENGTH
    param: value
    type: float
    required: false
    default: 1
    help: How strongly the last frame image conditions the end of the generated video.
    node: '2108'
  seed:
    node_title: 'RandomNoise #15'
    param: noise_seed
    type: int
    required: false
    default: 42
    help: Seed for the base-resolution first pass.
    node: '15'
  seed_refine:
    node_title: 'RandomNoise #14'
    param: noise_seed
    type: int
    required: false
    default: 43
    help: Seed for the second (spatial-upscale + refine) pass.
    node: '14'
  width:
    node_title: WIDTH
    param: value
    type: int
    required: false
    default: 960
    node: '2080'
  height:
    node_title: HEIGHT
    param: value
    type: int
    required: false
    default: 544
    node: '2079'
  length_seconds:
    node_title: LENGTH (in seconds)
    param: value
    type: int
    required: false
    default: 10
    node: '2078'
  fps:
    node_title: FPS
    param: value
    type: float
    required: false
    default: 24
    node: '2076'
  transition_reference_audio:
    node_title: Load Audio
    param: audio
    type: str
    required: true
    help: 'Reference audio for the transition effect. Must already exist in ComfyUI''s
      input directory -- no upload path exists for audio in this CLI yet. The original
      workflow''s own default (''ComfyUI_00130_.mp3'') was the author''s local upload
      artifact and never shipped with the workflow, so there''s no usable default
      here (confirmed 2026-07-22: LoadAudio''s own validation rejects it outright).'
    node: '2183'
