description: 'LTX-2.3 i2v/t2v "long video" experimental pipeline (loop variant): a
  starting image is animated with a base pass, then extended via a real ComfyUI for-loop
  (easy forLoopStart/End, "LOOPS" = 3 iterations) that repeats the extend-group (overlap-stitched
  via motion frames) N times, with "ACCUMULATED VIDEO" as an intra-loop checkpoint
  save and "PARTIAL VIDEO FROM LOOP" as each iteration''s own new segment. The true
  end-to-end deliverable is "FINAL VIDEO", fed from the for loop''s own terminal "For
  Loop End" node -- unlike the sibling (non-"-loop") workflow, this one has a single
  unambiguous final output since the loop is a real iteration construct instead of
  5 hand-duplicated parallel variants. The extend/overlap/motion-frame stitching math
  inside the loop body is left as fixed structural complexity -- not flagged.

  '
workflow: long-video-experimental-i2v-t2v-long-video-custom-audio-loop.json
mode: [i2v, t2v]
output_node_title: FINAL VIDEO
flags:
  positive_prompt:
    node_title: 'PROMPT #825'
    param: value
    type: str
    required: false
    default: "Make this image come alive with fluid motion. \n\nA beautiful female\
      \ with guitar is singing and playing guitar, sitting down at a chair.  She sings\
      \ with perfect lip-sync to the attached audio. \n\nShe is singing a beautiful\
      \ slow song with passionate expression at her face.\n\nCinematic engaging video\
      \ from a cosy cafe lounge venue."
    help: 'Continuation prompt fed into the extend-loop''s CLIP Text Encode #821:431
      each iteration.'
    node: '825'
  negative_prompt:
    node_title: 'CLIP Text Encode (Prompt) #821:435'
    param: text
    type: str
    required: false
    default: text, subtitles, logo, still image, still video, no motion, static, frozen,
      blurry, low quality, distorted, bad anatomy, oversaturated, pixelated, low resolution,
      grainy, compression artifacts, jpeg artifacts, glitches, watermark, signature,
      copyright,  distortedsound, saturated sound, loud sound
    node: 821:435
  seed:
    node_title: SEED
    param: value
    type: int
    required: false
    default: 100
    node: '1138'
  image1:
    node_title: Load Image
    param: image
    type: image
    required: true
    help: Starting frame animated by the base pass, then extended by the for-loop.
    node: '1784'
  audio:
    node_title: Load Audio
    param: audio
    type: str
    required: false
    default: Hallelujah - Lucy Thomas - (Official Music Video).mp3
    help: Custom audio track (lip-sync source). Must already exist in ComfyUI's input
      directory -- no upload path for audio in this CLI.
    node: '2124'
  loops:
    node_title: LOOPS
    param: value
    type: int
    required: false
    default: 3
    help: Number of times the extend-group for-loop iterates; directly controls total
      output length.
    node: '2139'
  length_seconds:
    node_title: LENGTH (in seconds)
    param: value
    type: int
    required: false
    default: 10
    help: Target length in seconds per extend segment.
    node: '2120'
  fps:
    node_title: FPS
    param: value
    type: float
    required: false
    default: 24
    node: '2123'
  width:
    node_title: WIDTH
    param: value
    type: int
    required: false
    default: 960
    node: '2137'
  height:
    node_title: HEIGHT
    param: value
    type: int
    required: false
    default: 544
    node: '2138'
