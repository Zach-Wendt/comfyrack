description: 'LTX-2.3 i2v/t2v "Movie Maker" short-story pipeline: one starting image
  is animated into a single multi-scene video using a "Prompt Relay Encode (Timeline)"
  custom node that internally drives the whole multi-sequence relay from ONE node
  -- a global_prompt plus a timeline_data JSON blob of {prompt, length, color} segments
  (default 4 segments summing to max_frames=481). Base pass -> LTXVLatentUpsampler
  spatial-upscale second pass -> single VHS_VideoCombine save. Only one save node
  exists, so output selection is unambiguous.

  '
workflow: movie-maker-i2v-t2v-short-story-promptrelay-timeline-multi-sequence.json
mode: [i2v, t2v]
output_node_title: "Video Combine \U0001F3A5\U0001F165\U0001F157\U0001F162"
flags:
  global_prompt:
    node_title: Prompt Relay Encode (Timeline)
    param: global_prompt
    type: str
    required: false
    default: 'Animation video. Continuous shot of a creature in the forest '
    help: Overarching scene description prepended ahead of each timeline segment's
      own prompt.
    node: '819'
  timeline_data:
    node_title: Prompt Relay Encode (Timeline)
    param: timeline_data
    type: str
    required: false
    default: '{"segments":[{"prompt":"The creature looks at the viewer, he talks and
      the creature says : \" lets go for 10 second awkward silence\".\n\nthe creature
      looks around and picks berries from the ground. ","length":241,"color":"#4f8edc"},{"prompt":"the
      creature shouts out : \"10 now\" ","length":48,"color":"#e07b3a"},{"prompt":"the
      creature smiles to the viewer. ","length":48,"color":"#5cb85c"},{"prompt":"And
      then the creature says:  \"last 6 seconds now\" ","length":144,"color":"#d9534f"}]}'
    help: 'Authoritative per-segment relay: JSON list of {prompt, length (frames),
      color}. The node''s local_prompts (pipe-delimited text) and segment_lengths
      (comma-delimited ints) widgets are a redundant display representation of this
      same data -- NOT exposed as separate flags here since patching only one would
      desync them from timeline_data; edit timeline_data alone.

      '
    node: '819'
  negative_prompt:
    node_title: CLIP Text Encode (Prompt)
    param: text
    type: str
    required: false
    default: blurry, oversaturated, pixelated, low resolution, grainy, distorted,
      noise, compression artifacts, jpeg artifacts, glitches, watermark, text, logo,
      signature, copyright, subtitles, distorted sound, saturated sound, loud
    node: '818'
  seed_pass1:
    node_title: 'RandomNoise #773'
    param: noise_seed
    type: int
    required: false
    default: 43
    help: Seed for the base (first) sampling pass.
    node: '773'
  seed_pass2:
    node_title: 'RandomNoise #774'
    param: noise_seed
    type: int
    required: false
    default: 42
    help: Seed for the spatial-upsampler (second) sampling pass.
    node: '774'
  image1:
    node_title: Load Image
    param: image
    type: image
    required: true
    node: '584'
  max_frames:
    node_title: Prompt Relay Encode (Timeline)
    param: max_frames
    type: int
    required: false
    default: 481
    help: 'Total frame budget for the relay. NOTE: EmptyLTXVLatentVideo''s length
      and LTXV Empty Latent Audio''s frames_number are separate literal 481s elsewhere
      in the graph, not wired to this value -- keep them in sync by editing the JSON
      directly if you change this.

      '
    node: '819'
  width:
    node_title: WIDTH
    param: value
    type: int
    required: false
    default: 640
    node: '699'
  height:
    node_title: HEIGHT
    param: value
    type: int
    required: false
    default: 640
    node: '701'
  fps:
    node_title: FPS
    param: value
    type: float
    required: false
    default: 24
    node: '697'
