description: Dubs a silent (or any) source video by generating new spoken audio from
  a text prompt (any language) with matching lip movement, then voice-clones the result
  onto the original speaker's voice timbre and mixes in the original background audio;
  the graph also contains a simpler 'LTX AUDIO' save node (no voice clone step) as
  an alternate, less complete output.
workflow: video-2-video-just-talk-add-voice-to-silent-video-v2v-just-talk-dub-any-silent-video-multilanguage.json
mode: [v2v]
output_node_title: DUBBED - LTX AUDIO + VOICE CLONE
flags:
  source_video:
    node_title: "Load Video FFmpeg (Upload) \U0001F3A5\U0001F165\U0001F157\U0001F162"
    param: video
    type: str
    required: false
    default: joker_therapy (1).mp4
    help: Source video to dub. Must already exist in ComfyUI's input directory --
      no upload path exists for video in this CLI yet.
    node: '642'
  prompt:
    node_title: PROMPT
    param: value
    type: str
    required: false
    default: "He talks deep voice in Spanish language and he says:\n\"Estos polic\xED\
      as y abogados no se atrever\xEDan a meterse con ninguno de ustedes. \xBFQu\xE9\
      \ pas\xF3? \xBFSe les cayeron los huevos?\" "
    help: What the subject says and in what language, driving both the generated dub
      audio and lip movement (may be auto-enhanced via LLM before use, see enable_prompt_enhancer).
    node: '487'
  negative_prompt:
    node_title: CLIP Text Encode (Prompt)
    param: text
    type: str
    required: false
    default: text, subtitles, logo, low quality, distorted, bad anatomy, oversaturated,
      pixelated, low resolution, grainy, compression artifacts, jpeg artifacts, glitches,
      watermark, signature, copyright,  distortedsound, saturated sound, loud sound
      , deformed facial features, asymmetrical face, missing facial features, extra
      limbs, disfigured hands, blurry teeth, disfigured teeth
    help: Negative prompt for the video/visual branch.
    node: '110'
  negative_audio_prompt:
    node_title: Negative Audio Prompt
    param: text
    type: str
    required: false
    default: ' distorted sound, saturated sound, loud sound'
    help: Negative prompt for the generated audio branch.
    node: '626'
  length_seconds:
    node_title: LENGTH (in seconds)
    param: value
    type: int
    required: false
    default: 12
    help: Duration (seconds) of source video processed/generated.
    node: '647'
  seed:
    node_title: 'RandomNoise #115'
    param: noise_seed
    type: int
    required: false
    default: 42
    help: Seed for the first (base dub) sampling pass.
    node: '115'
  seed_upsample:
    node_title: 'RandomNoise #243'
    param: noise_seed
    type: int
    required: false
    default: 432
    help: Seed for the second (spatial-upsample refine) sampling pass.
    node: '243'
  fps:
    node_title: FPS
    param: value
    type: float
    required: false
    default: 24
    help: Frame rate used for loading the source video and for the output video combine.
    node: '214'
  max_pixel_size:
    node_title: MAX PIXEL SIZE (longest)
    param: value
    type: int
    required: false
    default: 1280
    help: Longest-edge pixel size the source video is resized to before generation.
    node: '497'
  enable_prompt_enhancer:
    node_title: ENABLE PROMPT ENHANCER
    param: value
    type: str
    required: false
    default: 'True'
    help: If true, the prompt is rewritten/expanded by an LLM (Gemma via TextGenerateLTX2Prompt)
      before use; if false, the raw prompt text is used as-is.
    node: '594'
  target_lufs:
    node_title: Audio Normalize (LUFS)
    param: target_lufs
    type: float
    required: false
    default: -20
    help: Loudness target (LUFS) the original video's audio is normalized to before
      being used as the voice-clone target and background-music source.
    node: '730'
