description: 'Same first+middle+last-frame-guided image-to-video (FML2V) pipeline
  as first-last-frame-fml2v-first-middle-last-frame-guider, plus a custom-audio path:
  a LoadAudio file is vocal-isolated (Mel-Band RoFormer, "USE VOCALS ONLY" fixed on)
  and VAE-encoded as the audio-latent guide instead of generating audio from scratch
  -- the "Custom Audio = true | LTX = false" switch is fixed on in this variant, so
  the loaded audio file always wins.

  '
workflow: first-last-frame-fml2v-first-middle-last-frame-guider-custom-audio.json
mode: [r2v]
output_node_title: "Video Combine \U0001F3A5\U0001F165\U0001F157\U0001F162"
flags:
  positive_prompt:
    node_title: PROMPT
    param: value
    type: str
    required: false
    default: "Make this image come alive with cinematic motion, smooth animation.\
      \ \n\nThe man is talking, and he says : \"They say drinking soda can be bad\
      \ for your health. But studies show that drinking LTX soda is good for you.\
      \ This messsage is approved by penguins\". \n\nPerfect lip-sync to the attached\
      \ audio. \n\nAt the end tracking camera that follows the soda can as the man\
      \ puts it down in the snow.\n\nIn the background the Artic, with stunning northern\
      \ lights in the sky, and penguins in the distance  "
    help: Raw creative prompt -- gets run through the internal LLM prompt-enhancer
      (using the stitched first+middle frames as visual context) before becoming the
      actual positive conditioning text.
    node: '2103'
  negative_prompt:
    node_title: 'CLIP Text Encode (Prompt) #11'
    param: text
    type: str
    required: false
    default: blurry, oversaturated, pixelated, low resolution, grainy, distorted,
      noise, compression artifacts, jpeg artifacts, glitches, watermark, text, logo,
      signature, copyright, subtitles, distorted sound, saturated sound, loud
    node: '11'
  first_frame:
    node_title: FIRST FRAME
    param: image
    type: image
    required: true
    help: Server-side upload ref of the video's opening frame -- caller uploads via
      cc.upload() first.
    node: '45'
  middle_frame:
    node_title: MIDDLE FRAME
    param: image
    type: image
    required: true
    help: Server-side upload ref of the frame the video should pass through partway
      -- caller uploads via cc.upload() first.
    node: '47'
  last_frame:
    node_title: LAST FRAME
    param: image
    type: image
    required: true
    help: Server-side upload ref of the video's closing frame -- caller uploads via
      cc.upload() first.
    node: '2172'
  first_frame_strength:
    node_title: FIRST FRAME STRENGTH
    param: value
    type: float
    required: false
    default: 0.7
    node: '2110'
  middle_frame_strength:
    node_title: MIDDLE FRAME STRENGTH
    param: value
    type: float
    required: false
    default: 0.3
    node: '2278'
  last_frame_strength:
    node_title: LAST FRAME STRENGTH
    param: value
    type: float
    required: false
    default: 1
    node: '2108'
  audio_file:
    node_title: Load Audio
    param: audio
    type: str
    required: false
    default: ComfyUI_00130_.mp3
    help: Filename of an audio file already present in ComfyUI's input directory (no
      upload path exists for audio in this CLI yet). Vocals are isolated and re-timed
      to the clip length before becoming the audio guide.
    node: '2312'
  seed:
    node_title: 'RandomNoise #15'
    param: noise_seed
    type: int
    required: false
    default: 42
    help: Seed for the base-resolution first pass.
    node: '15'
  seed_refine:
    node_title: 'RandomNoise #14'
    param: noise_seed
    type: int
    required: false
    default: 43
    help: Seed for the second (spatial-upscale + refine) pass.
    node: '14'
  width:
    node_title: WIDTH
    param: value
    type: int
    required: false
    default: 1280
    node: '2080'
  height:
    node_title: HEIGHT
    param: value
    type: int
    required: false
    default: 720
    node: '2079'
  length_seconds:
    node_title: LENGTH (in seconds)
    param: value
    type: int
    required: false
    default: 15
    node: '2078'
  fps:
    node_title: FPS
    param: value
    type: float
    required: false
    default: 24
    node: '2076'
