description: 'Infographic generator (SenseNova U1.5 8B MoT): content text + layout + style -> a batch
  of candidate infographics, OCR-checked against the content and ranked. Outputs on ComfyUI: a contact
  sheet (primary result, ranked candidates with scores), every candidate at full size, and the best one
  center-cropped to the platform size. This is the workflow Superflow''s Graphics tab runs. Needs the
  ComfyUI-Superflow node pack and two model files: checkpoint
  SenseNova-U1.5-8B-MoT-int8_convrot.safetensors and text encoder qwen3vl_8b_fp8_scaled.safetensors (download
  links: models.json in the pack). About 9 minutes for 6 candidates on one GPU. Source: the pack''s example_workflows/infographic.json
  (UI format), converted by hand to API format because comfyrack''s converter does not handle linked widgets
  that keep their slot in widgets_values or dynamic-combo widgets.'
workflow: infographic.json
mode:
- t2i
output_node_title: Contact sheet (pick here)
output: image
outputs:
- title: Contact sheet (pick here)
  kind: image
- title: All candidates (full size)
  kind: image
- title: Best (platform size)
  kind: image
- title: Text check report
  kind: text
requires:
  nodes:
    CLIPLoader: core
    CLIPTextEncode: core
    CheckpointLoaderSimple: core
    EmptyHiDreamO1LatentImage: core
    ImageScale: core
    InfographicPlatformSize: ComfyUI-Superflow
    InfographicPrompt: ComfyUI-Superflow
    InfographicRank: ComfyUI-Superflow
    InfographicTextCheck: ComfyUI-Superflow
    KSampler: core
    PreviewAny: core
    RebatchImages: core
    SaveImage: core
    SenseNovaSamplingOptions: core
    TextGenerate: core
    VAEDecode: core
  custom_node_packs:
  - name: ComfyUI-Superflow
    git: https://github.com/Zach-Wendt/ComfyUI-Superflow
  models:
  - directory: checkpoints
    name: SenseNova-U1.5-8B-MoT-int8_convrot.safetensors
    url: https://huggingface.co/jtreminio/SenseNova-U1.5-8B-MoT-int8_convrot/resolve/main/SenseNova-U1.5-8B-MoT-int8_convrot.safetensors
  - directory: text_encoders
    name: qwen3vl_8b_fp8_scaled.safetensors
    url: https://huggingface.co/Comfy-Org/Qwen3-VL/resolve/main/text_encoders/qwen3vl_8b_fp8_scaled.safetensors
flags:
  content:
    node_title: InfographicPrompt
    param: content
    type: str
    default: |-
      How Vaccines Train Your Immune System

      - Step 1: Vaccine delivers a harmless antigen
      - Step 2: B cells produce matching antibodies
      - Step 3: Memory cells store the pattern for years

      - Protection builds in about 2 weeks
      - 95% efficacy in clinical trials
    help: Exact text to render (1-4000 chars). First line = title; '- ' lines = items; a blank line or
      '# Heading' starts a new section. Section 1 is the main flow; later sections become callout cards.
    node: '3'
    min_length: 1
    max_length: 4000
    required: false
  imagery:
    node_title: InfographicPrompt
    param: imagery
    type: str
    default: |-
      syringe releasing a droplet
      round teal cell with Y-shaped antibodies
      glowing yellow cell
      calendar with a checkmark
      upward bar chart
    help: 'Optional (0-2000 chars): one picture per item, in content order (steps, then cards). Blank
      line = generic pictogram. Describe pictures only, no words to print. Filled-in imagery gives cleaner
      results.'
    node: '3'
    min_length: 0
    max_length: 2000
  platform:
    node_title: InfographicPlatformSize
    param: platform
    type: str
    default: LinkedIn portrait (1200x1500)
    help: 'Target post size. Generation runs at the nearest SenseNova size, then the best image is center-cropped
      to this size. Options: LinkedIn portrait (1200x1500); Instagram portrait (1080x1350); Instagram
      square (1080x1080); X / Twitter (1600x900); Slide 16:9 (1920x1080); Poster A-series portrait (1754x2480);
      Paper figure wide (2400x1200).'
    node: '2'
    # Static copy of the node's options, so the form keeps its dropdowns when the machine is offline.
    choices:
    - "LinkedIn portrait (1200x1500)"
    - "Instagram portrait (1080x1350)"
    - "Instagram square (1080x1080)"
    - "X / Twitter (1600x900)"
    - "Slide 16:9 (1920x1080)"
    - "Poster A-series portrait (1754x2480)"
    - "Paper figure wide (2400x1200)"
  layout:
    node_title: InfographicPrompt
    param: layout
    type: str
    default: auto
    help: 'Arrangement. auto: comparison for ''vs'', step flow for ''Step N'' or year-led items, dashboard
      for mostly-numeric items, else bento grid. Options: see the node''s layout list in /object_info.'
    node: '3'
