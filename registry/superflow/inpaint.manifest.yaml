description: Brush-mask inpaint (Qwen-Image-Edit-2511 + Lightning 4-step LoRA, crop-and-stitch). The
  mask is the input image's alpha channel - transparent pixels are repainted (ComfyUI LoadImage MASK
  output). Send an RGBA PNG. The result is stitched back at full size. Based on registry/qwen/segment-inpaint
  with SAM3 replaced by LoadImage's MASK.
workflow: inpaint.json
mode: [i2i]
output: image
output_node_title: Image
outputs:
  - {title: Image, kind: image}
requires:
  nodes:
    CFGNorm: core
    CLIPLoader: core
    DifferentialDiffusion: core
    GrowMask: core
    InpaintCropImproved: comfyui-inpaint-cropandstitch
    InpaintModelConditioning: core
    InpaintStitchImproved: comfyui-inpaint-cropandstitch
    KSampler: core
    LoadImage: core
    LoraLoaderModelOnly: core
    ModelSamplingAuraFlow: core
    SaveImage: core
    TextEncodeQwenImageEditPlus: core
    UNETLoader: core
    VAEDecode: core
    VAELoader: core
  custom_node_packs:
  - name: comfyui-inpaint-cropandstitch
    git: https://github.com/lquesada/ComfyUI-Inpaint-CropAndStitch
    registry_id: comfyui-inpaint-cropandstitch
  models:
  - directory: diffusion_models
    name: qwen_image_edit_2511_bf16.safetensors
    url: https://huggingface.co/Comfy-Org/Qwen-Image-Edit_ComfyUI/resolve/main/split_files/diffusion_models/qwen_image_edit_2511_bf16.safetensors
  - directory: loras
    name: Qwen-Image-Edit-2511-Lightning-4steps-V1.0-bf16.safetensors
    url: https://huggingface.co/lightx2v/Qwen-Image-Edit-2511-Lightning/resolve/main/Qwen-Image-Edit-2511-Lightning-4steps-V1.0-bf16.safetensors
  - directory: text_encoders
    name: qwen_2.5_vl_7b_fp8_scaled.safetensors
    url: https://huggingface.co/Comfy-Org/Qwen-Image_ComfyUI/resolve/main/split_files/text_encoders/qwen_2.5_vl_7b_fp8_scaled.safetensors
  - directory: vae
    name: qwen_image_vae.safetensors
    url: https://huggingface.co/Comfy-Org/Qwen-Image_ComfyUI/resolve/main/split_files/vae/qwen_image_vae.safetensors
flags:
  image:
    node_title: Source Image
    param: image
    type: image
    required: true
    help: RGBA PNG. Transparent pixels mark the area to repaint.
    node: '1'
  instruction:
    node_title: Positive Prompt
    param: prompt
    type: str
    required: true
    help: What to paint in the masked area.
    node: '12'
  feather:
    node_title: Feather (grow mask)
    param: expand
    type: int
    default: 8
    min: 0
    max: 64
    help: Pixels to grow the mask by so edits blend past the brush edge (0-64). The stitch also blends
      16 px.
    node: '3'
  seed:
    node_title: KSampler
    param: seed
    type: int
    default: 42
    node: '15'
